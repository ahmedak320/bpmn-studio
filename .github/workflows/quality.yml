name: Lite Quality

on:
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref resolved once by identity before exact-SHA quality checkouts
        required: false
        type: string
      expected_sha:
        description: Exact 40-character commit expected from source_ref
        required: false
        type: string
      artifact_prefix:
        description: Namespace for the single-file build artifact
        required: false
        default: orbitpm-tested-pages
        type: string
      release_tag:
        description: Annotated tag required when release_mode is true
        required: false
        type: string
      release_mode:
        description: Enable tag-bound release checks and live-CORS browser probes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.0
  NPM_VERSION: 11.13.0

jobs:
  identity:
    name: Bind every quality job to one immutable source identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact commit and optional annotated release tag
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "${#EXPECTED_SHA}" -eq 40
          case "$EXPECTED_SHA" in
            *[!0-9a-fA-F]*)
              echo "expected_sha must contain exactly 40 hexadecimal characters" >&2
              exit 1
              ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if test "$RELEASE_MODE" = "true"; then
            test -n "$RELEASE_TAG"
            git fetch --force origin \
              refs/heads/main:refs/remotes/origin/main \
              "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          fi

  policy:
    name: Policy, types, lint, and supply chain
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: |
          npm ci
          git diff --exit-code -- package.json package-lock.json
          npm run check:lock

      - name: Formatting
        run: npm run format:check

      - name: GitHub Actions syntax and shell safety
        run: npm run check:actions

      - name: Release lifecycle static invariants
        run: node scripts/check-release-workflows.mjs

      - name: Install Chromium for browser evidence verifiers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Release evidence verifier regression tests
        run: >-
          node --test
          scripts/browser-environment-evidence.test.mjs
          scripts/check-no-skips.test.mjs
          scripts/pages-evidence-chain.test.mjs
          scripts/release-evidence-chain.test.mjs
          scripts/release-reporter.test.mjs
          scripts/release-review-gate.test.mjs
          scripts/release-workflow-critical-invariants.test.mjs
          scripts/verify-browser-compatibility-evidence.test.mjs
          scripts/verify-external-release-evidence.test.mjs
          scripts/workflow-action-pins.test.mjs

      - name: Strict TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Test integrity
        run: npm run check:no-skips

      - name: Lite-only active tree
        run: npm run check:lite-only

      - name: Localized user-interface copy
        run: npm run check:ui-copy

      - name: CSP egress allowlist
        run: npm run check:csp

      - name: bpmn.io license attribution source policy
        run: npm run check:attribution

      - name: Dependency audit
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low

      - name: License policy and report
        run: npm run license:check -- --report compliance/THIRD_PARTY_NOTICES.md

      - name: CycloneDX SBOM
        run: npm run sbom -- --output compliance/OrbitPM-Process-Studio-Lite-0.4.5.cyclonedx.json

      - name: Upload compliance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-compliance-${{ github.sha }}
          path: compliance/
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: Current-tree and history secret scan
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install checksum-verified Gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check -
          mkdir "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan current tree
        run: gitleaks dir . --redact --no-banner

      - name: Scan complete Git history
        run: gitleaks git . --log-opts=--all --redact --no-banner

  unit:
    name: Unit, integration, standards, archives, and coverage
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: npm ci

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Real BPMN XSD and lint fixtures
        run: npm run test:validation

      - name: Malformed ZIP, DOCX, XLSX, and CSV fixtures
        run: npm run test:archives

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

  performance:
    name: Performance budgets at release fixture sizes
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ORBITPM_PERFORMANCE_HARDWARE_PROFILE: github-hosted-ubuntu-24.04-x64-runner-class-v1
      ORBITPM_PERFORMANCE_EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: npm ci

      - name: Run measured release-size fixtures
        run: >-
          npm run test:performance --
          --output=performance-results.json
          --require-release-evidence

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-performance-${{ github.sha }}
          path: performance-results.json
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Fresh single-file release build
    needs: [identity, policy, secrets, unit, performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: npm ci

      - name: Fresh build
        run: |
          npm run clean:dist
          npm run build

      - name: Raw and gzip artifact budgets
        run: npm run check:size

      - name: Built-artifact CSP egress allowlist
        run: npm run check:csp -- dist/index.html

      - name: Built-artifact bpmn.io attribution
        run: npm run check:attribution -- dist/index.html

      - name: Upload exact tested artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact_prefix || 'orbitpm-tested-pages' }}-${{ inputs.expected_sha || github.sha }}
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Playwright (${{ matrix.browser }}, zero retries)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: npm ci

      - name: Download exact build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_prefix || 'orbitpm-tested-pages' }}-${{ inputs.expected_sha || github.sha }}
          path: dist

      - name: Verify downloaded build
        run: npm run check:size

      - name: Install browser
        run: ./node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}

      - name: Record exact browser, platform, artifact, URL, and locale evidence
        if: ${{ matrix.browser == 'chromium' }}
        run: |
          node scripts/browser-environment-evidence.mjs \
            --candidate-sha="$GITHUB_SHA" \
            --artifact=dist/index.html \
            --browsers=chromium \
            --output=test-results/environment-chromium.json

      - name: Run browser suite without rebuild, skip, flake, or retry
        env:
          CI: true
          LITE_LIVE_CORS: ${{ inputs.release_mode && '1' || '0' }}
          ORBITPM_PLAYWRIGHT_SUMMARY: test-results/release-${{ matrix.browser }}.json
        run: >-
          ./node_modules/.bin/playwright test
          --project=${{ matrix.browser }}
          --forbid-only
          --retries=0
          --fail-on-flaky-tests
          --update-snapshots=none
          --reporter=line,./scripts/release-reporter.mjs
          --global-timeout=${{ matrix.browser == 'webkit' && 900000 || 600000 }}

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-playwright-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  browser-performance:
    name: Real XLSX worker-to-preview budgets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ORBITPM_PERFORMANCE_HARDWARE_PROFILE: github-hosted-ubuntu-24.04-x64-runner-class-v1
      ORBITPM_PERFORMANCE_EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: npm ci

      - name: Download exact build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_prefix || 'orbitpm-tested-pages' }}-${{ inputs.expected_sha || github.sha }}
          path: dist

      - name: Verify downloaded build
        run: npm run check:size

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Measure real XLSX worker-to-preview latency and UI heartbeat
        env:
          CI: true
        run: >-
          npm run test:performance:browser --
          --output=performance-browser-results.json
          --artifact=dist/index.html
          --require-release-evidence

      - name: Upload browser performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-browser-performance-${{ github.sha }}
          path: performance-browser-results.json
          if-no-files-found: error
          retention-days: 30

  accessibility:
    name: Axe EN/AR, light/dark, desktop/mobile
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: npm ci

      - name: Download exact build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_prefix || 'orbitpm-tested-pages' }}-${{ inputs.expected_sha || github.sha }}
          path: dist

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run WCAG 2.2 AA matrix
        run: npm run test:a11y -- --browser=chromium --output=accessibility-results.json

      - name: Upload accessibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-accessibility-${{ github.sha }}
          path: accessibility-results.json
          if-no-files-found: warn
          retention-days: 30
