name: Deploy approved tagged Lite artifact to Pages

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact origin/main merge commit peeled from the approved annotated tag
        required: true
        type: string
      release_tag:
        description: Approved annotated release tag
        required: true
        default: v0.4.5
        type: string
      release_run_id:
        description: Successful tag, draft, and clean tag-quality workflow run ID
        required: true
        type: string
      external_evidence_url:
        description: Reviewed NVDA, VoiceOver, Arabic, 48-hour soak, and P0/P1 evidence URL (optional; owner waived human evidence for 0.4.5 on 2026-07-27)
        required: false
        type: string
      external_evidence_sha256:
        description: SHA-256 of the candidate-bound external evidence JSON (optional; see external_evidence_url)
        required: false
        type: string
      rollback_tag:
        description: Published known-good tag used only if this deployment must roll back
        required: true
        default: v0.4.4
        type: string
      rollback_commit_sha:
        description: Exact commit peeled from rollback_tag
        required: true
        default: cd842b6e0b8d7283e2704ae71ec207440b9e54f2
        type: string
      rollback_asset_name:
        description: Exact self-contained Lite HTML asset in rollback_tag
        required: true
        default: OrbitPM-Process-Studio-Lite.html
        type: string
      rollback_asset_sha256:
        description: Recorded SHA-256 for the known-good rollback asset
        required: true
        default: 874294dd41beab992a057924b7d23bf992892363023372cf0221cb215e0c931e
        type: string

permissions:
  contents: read

concurrency:
  group: orbitpm-release-lifecycle-v0.4.5
  cancel-in-progress: false

jobs:
  identity:
    name: Bind Pages to draft bytes, tag quality, and origin/main
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact candidate history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact Git and successful tag-quality workflow identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "${#CANDIDATE_SHA}" -eq 40
          case "$CANDIDATE_SHA" in
            *[!0-9a-fA-F]*) exit 1 ;;
          esac
          # Owner waiver 2026-07-27: evidence inputs are optional; validate
          # their format only when supplied.
          if [ -n "$EVIDENCE_URL" ]; then
            case "$EVIDENCE_URL" in
              https://?*) ;;
              *) exit 1 ;;
            esac
            test "${#EVIDENCE_SHA256}" -eq 64
            case "$EVIDENCE_SHA256" in
              *[!0-9a-fA-F]*) exit 1 ;;
            esac
          fi
          case "$RELEASE_RUN_ID" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/check-release-tag.mjs "$RELEASE_TAG" --require-origin-main
          release_run_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID"
          )"
          current_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r .name <<<"$release_run_json")" = \
            "Create annotated tag and draft Lite release"
          test "$(jq -r .path <<<"$release_run_json")" = ".github/workflows/release.yml"
          test "$(jq -r .event <<<"$release_run_json")" = "workflow_dispatch"
          test "$(jq -r .status <<<"$release_run_json")" = "completed"
          test "$(jq -r .conclusion <<<"$release_run_json")" = "success"
          test "$(jq -r .head_sha <<<"$release_run_json")" = "$CANDIDATE_SHA"
          test "$(jq -r .head_branch <<<"$release_run_json")" = "main"
          RELEASE_COMPLETED_AT="$(jq -r .updated_at <<<"$release_run_json")" \
            PAGES_STARTED_AT="$(jq -r .created_at <<<"$current_run_json")" \
            node --eval "
              const completed = Date.parse(process.env.RELEASE_COMPLETED_AT)
              const started = Date.parse(process.env.PAGES_STARTED_AT)
              if (!Number.isFinite(completed) || !Number.isFinite(started) || completed >= started) {
                throw new Error('The selected release run did not complete before this Pages run.')
              }
            "
          artifacts_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100"
          )"
          artifact_name="orbitpm-tag-release-assets-$CANDIDATE_SHA"
          test "$(
            jq --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              <<<"$artifacts_json"
          )" -eq 1
          # Owner waiver 2026-07-27: the tag-bound evidence artifact exists
          # only when external evidence was supplied to the release run.
          if [ -n "$EVIDENCE_URL" ]; then
            evidence_name="orbitpm-tag-external-evidence-$CANDIDATE_SHA"
            test "$(
              jq --arg name "$evidence_name" \
                '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
                <<<"$artifacts_json"
            )" -eq 1
          fi

      - name: Download exact clean-tag asset artifact
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: >-
          gh run download "$RELEASE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "orbitpm-tag-release-assets-$CANDIDATE_SHA"
          --dir tag-release

      - name: Download trusted tag-bound external-evidence aggregate
        # Owner waiver 2026-07-27: runs only when external evidence is supplied.
        if: ${{ inputs.external_evidence_url != '' }}
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: >-
          gh run download "$RELEASE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "orbitpm-tag-external-evidence-$CANDIDATE_SHA"
          --dir release-evidence

      - name: Re-download and hash all seven draft assets before approval
        env:
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | .[0]' > draft-release.json
          test "$(jq -r .tag_name draft-release.json)" = "$RELEASE_TAG"
          mkdir draft-preapproval
          gh release download "$RELEASE_TAG" --dir draft-preapproval
          node scripts/release-state.mjs \
            --release-json=draft-release.json \
            --assets=draft-preapproval \
            --expected-assets=tag-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag="$RELEASE_TAG" \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=draft
          # Owner waiver 2026-07-27: evidence-chain verification runs only
          # when external evidence is supplied.
          if [ -n "$EVIDENCE_URL" ]; then
            candidate_ready_at="$(
              jq -er .candidateReadyAt \
                release-evidence/tag-external-evidence-verification.json
            )"
            node scripts/release-evidence-chain.mjs verify \
              --aggregate=release-evidence/tag-external-evidence-verification.json \
              --candidate-sha=${{ inputs.candidate_sha }} \
              --candidate-ready-at="$candidate_ready_at" \
              --artifact=tag-release/OrbitPM-Process-Studio-Lite-0.4.5.html \
              --source-url="$EVIDENCE_URL" \
              --source-sha256=${{ inputs.external_evidence_sha256 }}
          fi

      - name: Preflight the exact known-good rollback release
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_ASSET: ${{ inputs.rollback_asset_name }}
          ROLLBACK_ASSET_SHA256: ${{ inputs.rollback_asset_sha256 }}
          ROLLBACK_SHA: ${{ inputs.rollback_commit_sha }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          test "$ROLLBACK_TAG" = "v0.4.4"
          test "$ROLLBACK_SHA" = "cd842b6e0b8d7283e2704ae71ec207440b9e54f2"
          test "$ROLLBACK_ASSET" = "OrbitPM-Process-Studio-Lite.html"
          test "$ROLLBACK_ASSET_SHA256" = \
            "874294dd41beab992a057924b7d23bf992892363023372cf0221cb215e0c931e"
          git fetch --force origin \
            "+refs/tags/$ROLLBACK_TAG:refs/tags/$ROLLBACK_TAG"
          test "$(git rev-parse "refs/tags/$ROLLBACK_TAG^{commit}")" = "$ROLLBACK_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ROLLBACK_TAG" \
            > rollback-release.json
          test "$(jq -r .draft rollback-release.json)" = "false"
          test "$(jq -r .prerelease rollback-release.json)" = "false"
          test "$(
            jq -r --arg name "$ROLLBACK_ASSET" \
              '.assets[] | select(.name == $name) | .digest' \
              rollback-release.json
          )" = "sha256:$ROLLBACK_ASSET_SHA256"
          mkdir rollback-preflight
          gh release download "$ROLLBACK_TAG" \
            --pattern "$ROLLBACK_ASSET" \
            --dir rollback-preflight
          echo "$ROLLBACK_ASSET_SHA256  rollback-preflight/$ROLLBACK_ASSET" |
            sha256sum --check -

  prepare:
    name: Read-only verification and Pages artifact preparation
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      pages-artifact-id: ${{ steps.upload-pages.outputs.artifact-id }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact approved tag commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: npm ci

      - name: Download clean-tag reference assets from the successful release run
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: >-
          gh run download "$RELEASE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "orbitpm-tag-release-assets-$CANDIDATE_SHA"
          --dir tag-release

      - name: Download the trusted release evidence aggregate after approval
        # Owner waiver 2026-07-27: runs only when external evidence is supplied.
        if: ${{ inputs.external_evidence_url != '' }}
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: >-
          gh run download "$RELEASE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "orbitpm-tag-external-evidence-$CANDIDATE_SHA"
          --dir trusted-release-evidence

      - name: Revalidate run, Git identity, draft metadata, checksums, and all bytes
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_run_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID"
          )"
          test "$(jq -r .conclusion <<<"$release_run_json")" = "success"
          test "$(jq -r .head_sha <<<"$release_run_json")" = "$CANDIDATE_SHA"
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/check-release-tag.mjs "$RELEASE_TAG" --require-origin-main
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | .[0]' > draft-before-deploy.json
          test "$(jq -r .tag_name draft-before-deploy.json)" = "$RELEASE_TAG"
          mkdir draft-before-deploy
          gh release download "$RELEASE_TAG" --dir draft-before-deploy
          npm run release:verify -- draft-before-deploy
          node scripts/release-state.mjs \
            --release-json=draft-before-deploy.json \
            --assets=draft-before-deploy \
            --expected-assets=tag-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag="$RELEASE_TAG" \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=draft

      - name: Revalidate candidate-bound external evidence against release bytes
        # Owner waiver 2026-07-27: runs only when external evidence is supplied.
        if: ${{ inputs.external_evidence_url != '' }}
        env:
          EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
        run: |
          candidate_ready_at="$(
            jq -er .candidateReadyAt \
              trusted-release-evidence/tag-external-evidence-verification.json
          )"
          node scripts/release-evidence-chain.mjs verify \
            --aggregate=trusted-release-evidence/tag-external-evidence-verification.json \
            --candidate-sha=${{ inputs.candidate_sha }} \
            --candidate-ready-at="$candidate_ready_at" \
            --artifact=draft-before-deploy/OrbitPM-Process-Studio-Lite-0.4.5.html \
            --source-url="$EVIDENCE_URL" \
            --source-sha256="$EVIDENCE_SHA256"
          node scripts/verify-external-release-evidence.mjs \
            --candidate-sha=${{ inputs.candidate_sha }} \
            --candidate-ready-at="$candidate_ready_at" \
            --artifact=draft-before-deploy/OrbitPM-Process-Studio-Lite-0.4.5.html \
            --url="$EVIDENCE_URL" \
            --sha256="$EVIDENCE_SHA256" \
            --output=evidence/pages-external-evidence-verification.json
          node scripts/release-evidence-chain.mjs compare \
            --trusted=trusted-release-evidence/tag-external-evidence-verification.json \
            --observed=evidence/pages-external-evidence-verification.json

      - name: Build Pages directory from the verified draft HTML
        run: |
          mkdir pages-dist
          cp \
            draft-before-deploy/OrbitPM-Process-Studio-Lite-0.4.5.html \
            pages-dist/index.html

      - name: Re-download all assets immediately before packaging
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/check-release-tag.mjs "$RELEASE_TAG" --require-origin-main
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | .[0]' > draft-prepackage.json
          test "$(jq -r .tag_name draft-prepackage.json)" = "$RELEASE_TAG"
          mkdir draft-prepackage
          gh release download "$RELEASE_TAG" --dir draft-prepackage
          node scripts/release-state.mjs \
            --release-json=draft-prepackage.json \
            --assets=draft-prepackage \
            --expected-assets=tag-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag="$RELEASE_TAG" \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=draft
          cmp \
            pages-dist/index.html \
            draft-prepackage/OrbitPM-Process-Studio-Lite-0.4.5.html

      - name: Create the exact GitHub Pages artifact tar
        run: >-
          tar
          --dereference
          --hard-dereference
          --directory pages-dist
          --create
          --file "$RUNNER_TEMP/artifact.tar"
          --exclude=.git
          --exclude=.github
          .

      - name: Upload candidate Pages artifact
        id: upload-pages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-pages-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  artifact-authority:
    name: Isolated authority for the actual uploaded Pages artifact
    needs: [identity, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      pages-artifact-archive-sha256: ${{ steps.stored-pages.outputs.archive-sha256 }}
      pages-artifact-id: ${{ steps.stored-pages.outputs.artifact-id }}
      pages-artifact-size: ${{ steps.stored-pages.outputs.archive-size }}
      release-projection-sha256: ${{ steps.release-authority.outputs.release-projection-sha256 }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download clean-tag release authority from the successful release run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: orbitpm-tag-release-assets-${{ inputs.candidate_sha }}
          path: tag-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}

      - name: Download fixed-data release mutation authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: orbitpm-release-mutation-authority-${{ inputs.candidate_sha }}
          path: release-authority
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}

      - name: Bind and inspect the exact stored Pages artifact
        id: stored-pages
        env:
          ARTIFACT_ID: ${{ needs.prepare.outputs.pages-artifact-id }}
          ARTIFACT_NAME: orbitpm-pages-candidate-${{ github.run_id }}
          EXPECTED_RUN_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          case "$ARTIFACT_ID" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          test "$ARTIFACT_ID" -ge 1
          case "$GITHUB_RUN_ID" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          test "${#EXPECTED_RUN_SHA}" -eq 40
          case "$EXPECTED_RUN_SHA" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          EXPECTED_HTML_SHA256="$(
            jq -er \
              '.assets[] |
                select(.name == "OrbitPM-Process-Studio-Lite-0.4.5.html") |
                .sha256' \
              release-authority/release-mutation-authority.json
          )"
          export EXPECTED_HTML_SHA256
          test "${#EXPECTED_HTML_SHA256}" -eq 64
          case "$EXPECTED_HTML_SHA256" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          verify_dir="$RUNNER_TEMP/pages-artifact-$ARTIFACT_ID"
          mkdir "$verify_dir"
          api_version=2026-03-10
          gh api --header "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > "$verify_dir/metadata.json"
          gh api --paginate --header "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
            jq -s '[.[].artifacts[]]' > "$verify_dir/run-artifacts.json"
          jq -e \
            --argjson id "$ARTIFACT_ID" \
            --arg name "$ARTIFACT_NAME" \
            --argjson run "$GITHUB_RUN_ID" \
            --arg sha "$EXPECTED_RUN_SHA" \
            '
              (.id == $id) and
              (.name == $name) and
              (.expired == false) and
              (.workflow_run.id == $run) and
              (.workflow_run.head_sha == $sha) and
              ((.size_in_bytes | type) == "number") and
              (.size_in_bytes > 0 and .size_in_bytes <= 67108864) and
              ((.digest | type) == "string") and
              (.digest | test("^sha256:[0-9a-f]{64}$"))
            ' "$verify_dir/metadata.json" >/dev/null
          server_digest="$(jq -er .digest "$verify_dir/metadata.json")"
          server_size="$(jq -er .size_in_bytes "$verify_dir/metadata.json")"
          jq -e \
            --argjson id "$ARTIFACT_ID" \
            --arg name "$ARTIFACT_NAME" \
            --arg digest "$server_digest" \
            '
              [.[] | select(.name == $name)] as $matches |
              (($matches | length) == 1) and
              ($matches[0].id == $id) and
              ($matches[0].expired == false) and
              ($matches[0].digest == $digest)
            ' "$verify_dir/run-artifacts.json" >/dev/null
          archive="$verify_dir/artifact.zip"
          curl --fail --silent --show-error --location \
            --proto '=https' \
            --proto-redir '=https' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: $api_version" \
            "${GITHUB_API_URL%/}/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$archive"
          test "$(stat --format=%s "$archive")" -eq "$server_size"
          actual_archive_digest="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
          test "$actual_archive_digest" = "$server_digest"
          unset GH_TOKEN
          export ARCHIVE_PATH="$archive"
          python3 -I - <<'PY'
          import hashlib
          import os
          import tarfile
          import tempfile
          import zipfile
          from pathlib import Path

          archive = Path(os.environ["ARCHIVE_PATH"])
          expected = os.environ["EXPECTED_HTML_SHA256"]
          max_tar = 64 * 1024 * 1024
          max_html = 32 * 1024 * 1024
          if len(expected) != 64 or any(c not in "0123456789abcdef" for c in expected):
              raise SystemExit("invalid expected HTML SHA-256")
          tar_hash = hashlib.sha256()
          with zipfile.ZipFile(archive, "r") as zf:
              infos = zf.infolist()
              if len(infos) != 1 or infos[0].filename != "artifact.tar" or infos[0].is_dir():
                  raise SystemExit(
                      f"outer ZIP must contain only artifact.tar; got {[i.filename for i in infos]!r}"
                  )
              info = infos[0]
              if info.flag_bits & 1 or not 0 < info.file_size <= max_tar:
                  raise SystemExit("invalid or oversized artifact.tar ZIP entry")
              tar_dir = tempfile.mkdtemp(prefix="pages-tar-", dir=os.environ["RUNNER_TEMP"])
              tar_path = Path(tar_dir) / "artifact.tar"
              copied = 0
              with zf.open(info) as source, tar_path.open("xb") as target:
                  while chunk := source.read(1024 * 1024):
                      copied += len(chunk)
                      if copied > max_tar:
                          raise SystemExit("artifact.tar exceeded bound")
                      tar_hash.update(chunk)
                      target.write(chunk)
              if copied != info.file_size:
                  raise SystemExit("artifact.tar size mismatch")
          with tarfile.open(tar_path, mode="r:") as tf:
              members = tf.getmembers()
              if tf.pax_headers or any(member.pax_headers for member in members):
                  raise SystemExit("PAX headers are not permitted")
              if len(members) != 2:
                  raise SystemExit(
                      f"tar must contain root and index.html only: {[m.name for m in members]!r}"
                  )
              root, html = members
              if root.name != "." or not root.isdir() or root.issym() or root.islnk():
                  raise SystemExit("first member must be real root directory '.'")
              if html.name != "./index.html" or not html.isfile() or html.issym() or html.islnk():
                  raise SystemExit("second member must be regular './index.html'")
              if (root.offset, html.offset, html.offset_data) != (0, 512, 1024):
                  raise SystemExit("unexpected hidden tar headers")
              if not 0 < html.size <= max_html or getattr(html, "sparse", None):
                  raise SystemExit("invalid or oversized index.html")
              source = tf.extractfile(html)
              if source is None:
                  raise SystemExit("cannot read index.html")
              html_hash = hashlib.sha256()
              seen = 0
              with source:
                  while chunk := source.read(1024 * 1024):
                      seen += len(chunk)
                      if seen > max_html:
                          raise SystemExit("index.html exceeded bound")
                      html_hash.update(chunk)
              if seen != html.size or html_hash.hexdigest() != expected:
                  raise SystemExit("index.html size or SHA-256 mismatch")
          tar_size = tar_path.stat().st_size
          payload_end = html.offset_data + ((html.size + 511) // 512) * 512
          if tar_size % 512 or payload_end + 1024 > tar_size:
              raise SystemExit("invalid tar terminator")
          tail_size = 0
          with tar_path.open("rb") as source:
              source.seek(payload_end)
              while chunk := source.read(1024 * 1024):
                  tail_size += len(chunk)
                  if any(chunk):
                      raise SystemExit("nonzero/concatenated data after index.html")
          if tail_size < 1024:
              raise SystemExit("missing tar end markers")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tar-sha256={tar_hash.hexdigest()}\n")
              output.write(f"html-sha256={html_hash.hexdigest()}\n")
              output.write(f"html-size={seen}\n")
          PY
          {
            echo "artifact-id=$ARTIFACT_ID"
            echo "artifact-name=$ARTIFACT_NAME"
            echo "archive-size=$server_size"
            echo "archive-sha256=${server_digest#sha256:}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the uploaded tar, draft, tag, main, and all seven assets
        id: release-authority
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          authority=release-authority/release-mutation-authority.json
          notes=release-authority/release-notes.md
          test "$RELEASE_TAG" = "v0.4.5"
          test "${#CANDIDATE_SHA}" -eq 40
          case "$CANDIDATE_SHA" in
            *[!0-9a-fA-F]*) exit 1 ;;
          esac
          case "$RELEASE_RUN_ID" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          expected_names="$(
            printf '%s\n' \
              LICENSE \
              OrbitPM-Excel-Example-0.4.5.xlsx \
              OrbitPM-Excel-Template-0.4.5.xlsx \
              OrbitPM-Process-Studio-Lite-0.4.5.cyclonedx.json \
              OrbitPM-Process-Studio-Lite-0.4.5.html \
              SHA256SUMS.txt \
              THIRD_PARTY_NOTICES.md
          )"
          test "$(find tag-release -maxdepth 1 -type f -printf '%f\n' | sort)" = \
            "$expected_names"
          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            '
              .schemaVersion == 1 and
              .gate == "orbitpm-lite-release-mutation-authority" and
              .candidateSha == $candidate and
              .releaseTag == "v0.4.5" and
              .releaseTitle == "OrbitPM Process Studio Lite 0.4.5" and
              (.notesSha256 | test("^[a-f0-9]{64}$")) and
              (.assets | length) == 7 and
              ([.assets[].name] | sort) == [
                "LICENSE",
                "OrbitPM-Excel-Example-0.4.5.xlsx",
                "OrbitPM-Excel-Template-0.4.5.xlsx",
                "OrbitPM-Process-Studio-Lite-0.4.5.cyclonedx.json",
                "OrbitPM-Process-Studio-Lite-0.4.5.html",
                "SHA256SUMS.txt",
                "THIRD_PARTY_NOTICES.md"
              ]
            ' "$authority" >/dev/null
          test "$(sha256sum "$notes" | cut -d' ' -f1)" = \
            "$(jq -r .notesSha256 "$authority")"
          while IFS=$'\t' read -r name size sha256; do
            test "$name" = "$(basename "$name")"
            test "$(stat --format=%s "tag-release/$name")" = "$size"
            test "$(sha256sum "tag-release/$name" | cut -d' ' -f1)" = "$sha256"
          done < <(jq -r '.assets[] | [.name, .size, .sha256] | @tsv' "$authority")
          test "${{ steps.stored-pages.outputs.html-sha256 }}" = "$(
            sha256sum tag-release/OrbitPM-Process-Studio-Lite-0.4.5.html |
              cut -d' ' -f1
          )"
          main_ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
          test "$(jq -r .object.sha <<<"$main_ref_json")" = "$CANDIDATE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            > protected-tag-ref.json
          tag_object_sha="$(jq -er .object.sha protected-tag-ref.json)"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
            > protected-tag-object.json
          test "$(jq -r .tag protected-tag-object.json)" = "$RELEASE_TAG"
          test "$(jq -r .object.type protected-tag-object.json)" = "commit"
          test "$(jq -r .object.sha protected-tag-object.json)" = "$CANDIDATE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | .[0]' > draft-at-deploy.json
          test "$(jq -r .tag_name draft-at-deploy.json)" = "$RELEASE_TAG"
          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            --rawfile notes "$notes" \
            '
              .tag_name == "v0.4.5" and
              .target_commitish == $candidate and
              .name == "OrbitPM Process Studio Lite 0.4.5" and
              .body == $notes and
              .draft == true and
              .prerelease == false and
              .published_at == null and
              .immutable != true and
              (.assets | length) == 7
            ' draft-at-deploy.json >/dev/null
          mkdir draft-at-deploy
          gh release download "$RELEASE_TAG" --dir draft-at-deploy
          while IFS=$'\t' read -r name size sha256; do
            test "$(
              jq --arg name "$name" \
                '[.assets[] | select(
                  .name == $name and
                  .state == "uploaded"
                )] | length' \
                draft-at-deploy.json
            )" -eq 1
            test "$(
              jq -r --arg name "$name" \
                '.assets[] | select(.name == $name) | .size' \
                draft-at-deploy.json
            )" = "$size"
            test "$(
              jq -r --arg name "$name" \
                '.assets[] | select(.name == $name) | .digest' \
                draft-at-deploy.json
            )" = "sha256:$sha256"
            test "$(sha256sum "draft-at-deploy/$name" | cut -d' ' -f1)" = "$sha256"
          done < <(jq -r '.assets[] | [.name, .size, .sha256] | @tsv' "$authority")
          mkdir artifact-authority
          release_projection_sha256="$(
            jq -S -c \
              '{
                id,
                tag_name,
                target_commitish,
                name,
                body,
                draft,
                prerelease,
                published_at,
                immutable,
                assets: (
                  [.assets[] | {id, name, size, digest, state}] |
                  sort_by(.name)
                )
              }' \
              draft-at-deploy.json |
              sha256sum |
              cut -d' ' -f1
          )"
          echo "release-projection-sha256=$release_projection_sha256" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg pagesArtifactArchiveSha256 \
              "${{ steps.stored-pages.outputs.archive-sha256 }}" \
            --arg pagesArtifactName "${{ steps.stored-pages.outputs.artifact-name }}" \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg pagesArtifactTarSha256 "${{ steps.stored-pages.outputs.tar-sha256 }}" \
            --arg pagesHtmlSha256 "${{ steps.stored-pages.outputs.html-sha256 }}" \
            --arg pagesWorkflowHeadSha "$GITHUB_SHA" \
            --argjson pagesArtifactId "${{ steps.stored-pages.outputs.artifact-id }}" \
            --argjson pagesArtifactSize "${{ steps.stored-pages.outputs.archive-size }}" \
            --argjson pagesHtmlSize "${{ steps.stored-pages.outputs.html-size }}" \
            --argjson pagesWorkflowRunId "$GITHUB_RUN_ID" \
            --arg releaseId "$(jq -r .id draft-at-deploy.json)" \
            --arg releaseProjectionSha256 "$release_projection_sha256" \
            --arg releaseRunId "$RELEASE_RUN_ID" \
            '{
              schemaVersion: 1,
              gate: "orbitpm-pages-artifact-authority",
              candidateSha: $candidateSha,
              releaseRunId: $releaseRunId,
              releaseId: $releaseId,
              releaseProjectionSha256: $releaseProjectionSha256,
              pagesArtifact: {
                id: $pagesArtifactId,
                name: $pagesArtifactName,
                size: $pagesArtifactSize,
                sha256: $pagesArtifactArchiveSha256,
                tarSha256: $pagesArtifactTarSha256
              },
              pagesWorkflowRunId: $pagesWorkflowRunId,
              pagesWorkflowHeadSha: $pagesWorkflowHeadSha,
              pagesHtmlSha256: $pagesHtmlSha256,
              pagesHtmlSize: $pagesHtmlSize,
              status: "passed"
            }' > artifact-authority/pages-artifact-authority.json

      - name: Preserve actual uploaded Pages artifact authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-pages-artifact-authority-${{ github.run_id }}
          path: artifact-authority/pages-artifact-authority.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Protected credential-isolated Pages deployment
    needs: artifact-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: orbitpm-pages-deployment
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require configured external-evidence approval policy
        env:
          APPROVAL_POLICY: ${{ vars.ORBITPM_PAGES_APPROVAL_POLICY }}
        run: >-
          test "$APPROVAL_POLICY" =
          "v0.4.5-owner-waived-review-human-evidence-2026-07-27"

      - name: Rebind exact artifact, main, tag, and draft after approval
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.artifact-authority.outputs.pages-artifact-archive-sha256 }}
          EXPECTED_ARCHIVE_SIZE: ${{ needs.artifact-authority.outputs.pages-artifact-size }}
          EXPECTED_ARTIFACT_ID: ${{ needs.artifact-authority.outputs.pages-artifact-id }}
          EXPECTED_RELEASE_PROJECTION_SHA256: ${{ needs.artifact-authority.outputs.release-projection-sha256 }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$EXPECTED_ARTIFACT_ID" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          case "$EXPECTED_ARCHIVE_SIZE" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          for digest in "$EXPECTED_ARCHIVE_SHA256" "$EXPECTED_RELEASE_PROJECTION_SHA256"; do
            test "${#digest}" -eq 64
            case "$digest" in
              *[!0-9a-f]*) exit 1 ;;
            esac
          done
          artifact_name="orbitpm-pages-candidate-$GITHUB_RUN_ID"
          artifact_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID"
          )"
          artifacts_json="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
              jq -s '[.[].artifacts[]]'
          )"
          jq -e \
            --arg digest "sha256:$EXPECTED_ARCHIVE_SHA256" \
            --argjson id "$EXPECTED_ARTIFACT_ID" \
            --arg name "$artifact_name" \
            --argjson run "$GITHUB_RUN_ID" \
            --arg sha "$CANDIDATE_SHA" \
            --argjson size "$EXPECTED_ARCHIVE_SIZE" \
            '
              .id == $id and
              .name == $name and
              .expired == false and
              .workflow_run.id == $run and
              .workflow_run.head_sha == $sha and
              .size_in_bytes == $size and
              .digest == $digest
            ' <<<"$artifact_json" >/dev/null
          jq -e \
            --argjson id "$EXPECTED_ARTIFACT_ID" \
            --arg name "$artifact_name" \
            '
              [.[] | select(.name == $name)] as $matches |
              ($matches | length) == 1 and
              $matches[0].id == $id and
              $matches[0].expired == false
            ' <<<"$artifacts_json" >/dev/null
          main_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
          test "$(jq -r .object.sha <<<"$main_ref")" = "$CANDIDATE_SHA"
          tag_ref="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          )"
          test "$(jq -r .object.type <<<"$tag_ref")" = "tag"
          tag_object="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$tag_ref")"
          )"
          test "$(jq -r .tag <<<"$tag_object")" = "$RELEASE_TAG"
          test "$(jq -r .object.type <<<"$tag_object")" = "commit"
          test "$(jq -r .object.sha <<<"$tag_object")" = "$CANDIDATE_SHA"
          release_json="$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq --arg tag "$RELEASE_TAG" \
                '[.[] | select(.tag_name == $tag)] | .[0]'
          )"
          test "$(jq -r .tag_name <<<"$release_json")" = "$RELEASE_TAG"
          release_projection_sha256="$(
            jq -S -c \
              '{
                id,
                tag_name,
                target_commitish,
                name,
                body,
                draft,
                prerelease,
                published_at,
                immutable,
                assets: (
                  [.assets[] | {id, name, size, digest, state}] |
                  sort_by(.name)
                )
              }' \
              <<<"$release_json" |
              sha256sum |
              cut -d' ' -f1
          )"
          test "$release_projection_sha256" = "$EXPECTED_RELEASE_PROJECTION_SHA256"

      - name: Deploy only the authority-verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: orbitpm-pages-candidate-${{ github.run_id }}

      - name: Require the canonical production deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: test "$DEPLOYMENT_URL" = "https://ahmedak320.github.io/bpmn-studio/"

  readback:
    name: Read-only deployed byte and evidence verification
    needs: [identity, artifact-authority, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact approved candidate for read-only evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: npm ci

      - name: Download clean-tag reference assets and retained release evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
        run: |
          gh run download "$RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "orbitpm-tag-release-assets-$CANDIDATE_SHA" \
            --dir tag-release
          if [ -n "$EVIDENCE_URL" ]; then
            gh run download "$RELEASE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "orbitpm-tag-external-evidence-$CANDIDATE_SHA" \
              --dir trusted-release-evidence
          fi
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "orbitpm-pages-artifact-authority-$GITHUB_RUN_ID" \
            --dir artifact-authority
          mkdir pages-dist evidence
          cp \
            tag-release/OrbitPM-Process-Studio-Lite-0.4.5.html \
            pages-dist/index.html
          if [ -n "$EVIDENCE_URL" ]; then
            cp \
              trusted-release-evidence/tag-external-evidence-verification.json \
              evidence/trusted-release-external-evidence-verification.json
          fi
          cp \
            artifact-authority/pages-artifact-authority.json \
            evidence/pages-artifact-authority.json

      - name: Reverify the retained evidence chain after deployment
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
        run: |
          if [ -n "$EVIDENCE_URL" ]; then
            candidate_ready_at="$(
              jq -er .candidateReadyAt \
                trusted-release-evidence/tag-external-evidence-verification.json
            )"
            node scripts/release-evidence-chain.mjs verify \
              --aggregate=trusted-release-evidence/tag-external-evidence-verification.json \
              --candidate-sha="$CANDIDATE_SHA" \
              --candidate-ready-at="$candidate_ready_at" \
              --artifact=pages-dist/index.html \
              --source-url="$EVIDENCE_URL" \
              --source-sha256="$EVIDENCE_SHA256"
            node scripts/verify-external-release-evidence.mjs \
              --candidate-sha="$CANDIDATE_SHA" \
              --candidate-ready-at="$candidate_ready_at" \
              --artifact=pages-dist/index.html \
              --url="$EVIDENCE_URL" \
              --sha256="$EVIDENCE_SHA256" \
              --output=evidence/pages-external-evidence-verification.json
            node scripts/release-evidence-chain.mjs compare \
              --trusted=trusted-release-evidence/tag-external-evidence-verification.json \
              --observed=evidence/pages-external-evidence-verification.json
          fi
          test "$(jq -r .gate evidence/pages-artifact-authority.json)" = \
            "orbitpm-pages-artifact-authority"
          test "$(jq -r .status evidence/pages-artifact-authority.json)" = "passed"
          test "$(jq -r .candidateSha evidence/pages-artifact-authority.json)" = \
            "$CANDIDATE_SHA"
          test "$(jq -r .pagesWorkflowRunId evidence/pages-artifact-authority.json)" = \
            "$GITHUB_RUN_ID"
          test "$(jq -r .pagesWorkflowHeadSha evidence/pages-artifact-authority.json)" = \
            "$GITHUB_SHA"
          test "$(jq -r .pagesArtifact.name evidence/pages-artifact-authority.json)" = \
            "orbitpm-pages-candidate-$GITHUB_RUN_ID"
          test "$(jq -r .pagesArtifact.id evidence/pages-artifact-authority.json)" -ge 1
          test "$(jq -r .pagesArtifact.size evidence/pages-artifact-authority.json)" -ge 1
          for field in sha256 tarSha256; do
            digest="$(jq -r ".pagesArtifact.$field" \
              evidence/pages-artifact-authority.json)"
            test "${#digest}" -eq 64
            case "$digest" in
              *[!0-9a-f]*) exit 1 ;;
            esac
          done
          test "$(jq -r .pagesHtmlSha256 evidence/pages-artifact-authority.json)" = \
            "$(sha256sum pages-dist/index.html | cut -d' ' -f1)"

      - name: Install current Chrome/Edge and pinned Playwright engines
        run: >-
          ./node_modules/.bin/playwright install --with-deps
          chromium chrome msedge firefox webkit

      - name: Require HTTP 200 without redirects at the canonical Pages URL
        env:
          PAGES_URL: https://ahmedak320.github.io/bpmn-studio/
        run: |
          for attempt in $(seq 1 150); do
            response="$(
              curl --fail --silent --show-error \
                --max-time 30 \
                --max-redirs 0 \
                --output pages-live.html \
                --write-out '%{http_code}\t%{url_effective}' \
                "$PAGES_URL"
            )" || true
            if test "$response" = "$(printf '200\t%s' "$PAGES_URL")" &&
              cmp pages-dist/index.html pages-live.html
            then
              break
            fi
            test "$attempt" -lt 150
            sleep 5
          done

      - name: Record exact Pages browser environment evidence
        env:
          PAGES_URL: https://ahmedak320.github.io/bpmn-studio/
        run: >-
          node scripts/browser-environment-evidence.mjs
          --candidate-sha=${{ inputs.candidate_sha }}
          --artifact=pages-dist/index.html
          --url="$PAGES_URL"
          --browsers=chromium,chrome,edge,firefox,webkit-linux
          --fetch-attempts=150
          --fetch-delay-ms=5000
          --output=evidence/pages-browser-environment.json

      - name: Compare deployed bytes and smoke EN/AR
        env:
          PAGES_URL: https://ahmedak320.github.io/bpmn-studio/
        run: >-
          node scripts/pages-smoke.mjs
          --artifact=pages-dist/index.html
          --fetch-attempts=150
          --fetch-delay-ms=5000

      - name: Read back the draft and Git identities after deployment
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/check-release-tag.mjs "$RELEASE_TAG" --require-origin-main
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | .[0]' > draft-postdeploy.json
          test "$(jq -r .tag_name draft-postdeploy.json)" = "$RELEASE_TAG"
          mkdir draft-postdeploy
          gh release download "$RELEASE_TAG" --dir draft-postdeploy
          node scripts/release-state.mjs \
            --release-json=draft-postdeploy.json \
            --assets=draft-postdeploy \
            --expected-assets=tag-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag="$RELEASE_TAG" \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=draft
          cmp \
            pages-dist/index.html \
            draft-postdeploy/OrbitPM-Process-Studio-Lite-0.4.5.html

      - name: Preserve Pages approval and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-pages-evidence-${{ inputs.candidate_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  rollback:
    name: Restore verified v0.4.4 bytes after a failed deployment attempt
    needs: [identity, prepare, artifact-authority, deploy, readback]
    if: >-
      ${{
        always() &&
        needs.identity.result == 'success' &&
        needs.artifact-authority.result == 'success' &&
        (
          needs.deploy.result == 'failure' ||
          (
            needs.deploy.result == 'success' &&
            needs.readback.result != 'success'
          )
        )
      }}
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/pages-rollback.yml
    with:
      authority_sha: ${{ inputs.candidate_sha }}
      authority_tag: ${{ inputs.release_tag }}
      known_good_tag: ${{ inputs.rollback_tag }}
      known_good_commit_sha: ${{ inputs.rollback_commit_sha }}
      known_good_asset_name: ${{ inputs.rollback_asset_name }}
      known_good_asset_sha256: ${{ inputs.rollback_asset_sha256 }}
      automatic_rollback: true
