name: Deploy approved tagged Lite artifact to Pages

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact origin/main merge commit peeled from the approved annotated tag
        required: true
        type: string
      release_tag:
        description: Approved annotated release tag
        required: true
        default: v0.4.5
        type: string
      release_run_id:
        description: Successful tag, draft, and clean tag-quality workflow run ID
        required: true
        type: string
      external_evidence_url:
        description: Reviewed NVDA, VoiceOver, Arabic, 48-hour soak, and P0/P1 evidence URL
        required: true
        type: string
      external_evidence_sha256:
        description: SHA-256 of the candidate-bound external evidence JSON
        required: true
        type: string
      rollback_tag:
        description: Published known-good tag used only if this deployment must roll back
        required: true
        default: v0.4.4
        type: string
      rollback_commit_sha:
        description: Exact commit peeled from rollback_tag
        required: true
        default: cd842b6e0b8d7283e2704ae71ec207440b9e54f2
        type: string
      rollback_asset_name:
        description: Exact self-contained Lite HTML asset in rollback_tag
        required: true
        default: OrbitPM-Process-Studio-Lite.html
        type: string
      rollback_asset_sha256:
        description: Recorded SHA-256 for the known-good rollback asset
        required: true
        default: 874294dd41beab992a057924b7d23bf992892363023372cf0221cb215e0c931e
        type: string

permissions:
  contents: read

concurrency:
  group: pages-v0.4.5
  cancel-in-progress: false

jobs:
  identity:
    name: Bind Pages to draft bytes, tag quality, and origin/main
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact candidate history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact Git and successful tag-quality workflow identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "${#CANDIDATE_SHA}" -eq 40
          case "$CANDIDATE_SHA" in
            *[!0-9a-fA-F]*) exit 1 ;;
          esac
          case "$EVIDENCE_URL" in
            https://?*) ;;
            *) exit 1 ;;
          esac
          test "${#EVIDENCE_SHA256}" -eq 64
          case "$EVIDENCE_SHA256" in
            *[!0-9a-fA-F]*) exit 1 ;;
          esac
          case "$RELEASE_RUN_ID" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/check-release-tag.mjs "$RELEASE_TAG" --require-origin-main
          release_run_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID"
          )"
          current_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r .name <<<"$release_run_json")" = \
            "Create annotated tag and draft Lite release"
          test "$(jq -r .path <<<"$release_run_json")" = ".github/workflows/release.yml"
          test "$(jq -r .event <<<"$release_run_json")" = "workflow_dispatch"
          test "$(jq -r .status <<<"$release_run_json")" = "completed"
          test "$(jq -r .conclusion <<<"$release_run_json")" = "success"
          test "$(jq -r .head_sha <<<"$release_run_json")" = "$CANDIDATE_SHA"
          test "$(jq -r .head_branch <<<"$release_run_json")" = "main"
          RELEASE_COMPLETED_AT="$(jq -r .updated_at <<<"$release_run_json")" \
            PAGES_STARTED_AT="$(jq -r .created_at <<<"$current_run_json")" \
            node --eval "
              const completed = Date.parse(process.env.RELEASE_COMPLETED_AT)
              const started = Date.parse(process.env.PAGES_STARTED_AT)
              if (!Number.isFinite(completed) || !Number.isFinite(started) || completed >= started) {
                throw new Error('The selected release run did not complete before this Pages run.')
              }
            "
          artifacts_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100"
          )"
          artifact_name="orbitpm-tag-release-assets-$CANDIDATE_SHA"
          test "$(
            jq --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              <<<"$artifacts_json"
          )" -eq 1
          evidence_name="orbitpm-tag-external-evidence-$CANDIDATE_SHA"
          test "$(
            jq --arg name "$evidence_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              <<<"$artifacts_json"
          )" -eq 1

      - name: Download exact clean-tag asset artifact
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: >-
          gh run download "$RELEASE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "orbitpm-tag-release-assets-$CANDIDATE_SHA"
          --dir tag-release

      - name: Download trusted tag-bound external-evidence aggregate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: >-
          gh run download "$RELEASE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "orbitpm-tag-external-evidence-$CANDIDATE_SHA"
          --dir release-evidence

      - name: Re-download and hash all seven draft assets before approval
        env:
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > draft-release.json
          mkdir draft-preapproval
          gh release download "$RELEASE_TAG" --dir draft-preapproval
          node scripts/release-state.mjs \
            --release-json=draft-release.json \
            --assets=draft-preapproval \
            --expected-assets=tag-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag="$RELEASE_TAG" \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=draft
          candidate_ready_at="$(
            jq -er .candidateReadyAt \
              release-evidence/tag-external-evidence-verification.json
          )"
          node scripts/release-evidence-chain.mjs verify \
            --aggregate=release-evidence/tag-external-evidence-verification.json \
            --candidate-sha=${{ inputs.candidate_sha }} \
            --candidate-ready-at="$candidate_ready_at" \
            --artifact=tag-release/OrbitPM-Process-Studio-Lite-0.4.5.html \
            --source-url="$EVIDENCE_URL" \
            --source-sha256=${{ inputs.external_evidence_sha256 }}

      - name: Preflight the exact known-good rollback release
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_ASSET: ${{ inputs.rollback_asset_name }}
          ROLLBACK_ASSET_SHA256: ${{ inputs.rollback_asset_sha256 }}
          ROLLBACK_SHA: ${{ inputs.rollback_commit_sha }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          test "$ROLLBACK_TAG" = "v0.4.4"
          test "$ROLLBACK_SHA" = "cd842b6e0b8d7283e2704ae71ec207440b9e54f2"
          test "$ROLLBACK_ASSET" = "OrbitPM-Process-Studio-Lite.html"
          test "$ROLLBACK_ASSET_SHA256" = \
            "874294dd41beab992a057924b7d23bf992892363023372cf0221cb215e0c931e"
          git fetch --force origin \
            "+refs/tags/$ROLLBACK_TAG:refs/tags/$ROLLBACK_TAG"
          test "$(git rev-parse "refs/tags/$ROLLBACK_TAG^{commit}")" = "$ROLLBACK_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ROLLBACK_TAG" \
            > rollback-release.json
          test "$(jq -r .draft rollback-release.json)" = "false"
          test "$(jq -r .prerelease rollback-release.json)" = "false"
          test "$(
            jq -r --arg name "$ROLLBACK_ASSET" \
              '.assets[] | select(.name == $name) | .digest' \
              rollback-release.json
          )" = "sha256:$ROLLBACK_ASSET_SHA256"
          mkdir rollback-preflight
          gh release download "$ROLLBACK_TAG" \
            --pattern "$ROLLBACK_ASSET" \
            --dir rollback-preflight
          echo "$ROLLBACK_ASSET_SHA256  rollback-preflight/$ROLLBACK_ASSET" |
            sha256sum --check -

  deploy:
    name: Protected deployment of exact draft release bytes
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    concurrency:
      group: orbitpm-pages-deployment
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require configured external-evidence approval policy
        env:
          APPROVAL_POLICY: ${{ vars.ORBITPM_PAGES_APPROVAL_POLICY }}
        run: >-
          test "$APPROVAL_POLICY" =
          "v0.4.5-nvda-voiceover-arabic-48h-p0p1-reviewed"

      - name: Checkout exact approved tag commit after approval
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: npm ci

      - name: Download clean-tag reference assets from the successful release run
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: >-
          gh run download "$RELEASE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "orbitpm-tag-release-assets-$CANDIDATE_SHA"
          --dir tag-release

      - name: Download the trusted release evidence aggregate after approval
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: >-
          gh run download "$RELEASE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "orbitpm-tag-external-evidence-$CANDIDATE_SHA"
          --dir trusted-release-evidence

      - name: Revalidate run, Git identity, draft metadata, checksums, and all bytes
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_run_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID"
          )"
          test "$(jq -r .conclusion <<<"$release_run_json")" = "success"
          test "$(jq -r .head_sha <<<"$release_run_json")" = "$CANDIDATE_SHA"
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/check-release-tag.mjs "$RELEASE_TAG" --require-origin-main
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > draft-before-deploy.json
          mkdir draft-before-deploy
          gh release download "$RELEASE_TAG" --dir draft-before-deploy
          npm run release:verify -- draft-before-deploy
          node scripts/release-state.mjs \
            --release-json=draft-before-deploy.json \
            --assets=draft-before-deploy \
            --expected-assets=tag-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag="$RELEASE_TAG" \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=draft

      - name: Revalidate candidate-bound external evidence against release bytes
        env:
          EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
        run: |
          candidate_ready_at="$(
            jq -er .candidateReadyAt \
              trusted-release-evidence/tag-external-evidence-verification.json
          )"
          node scripts/release-evidence-chain.mjs verify \
            --aggregate=trusted-release-evidence/tag-external-evidence-verification.json \
            --candidate-sha=${{ inputs.candidate_sha }} \
            --candidate-ready-at="$candidate_ready_at" \
            --artifact=draft-before-deploy/OrbitPM-Process-Studio-Lite-0.4.5.html \
            --source-url="$EVIDENCE_URL" \
            --source-sha256="$EVIDENCE_SHA256"
          node scripts/verify-external-release-evidence.mjs \
            --candidate-sha=${{ inputs.candidate_sha }} \
            --candidate-ready-at="$candidate_ready_at" \
            --artifact=draft-before-deploy/OrbitPM-Process-Studio-Lite-0.4.5.html \
            --url="$EVIDENCE_URL" \
            --sha256="$EVIDENCE_SHA256" \
            --output=evidence/pages-external-evidence-verification.json
          node scripts/release-evidence-chain.mjs compare \
            --trusted=trusted-release-evidence/tag-external-evidence-verification.json \
            --observed=evidence/pages-external-evidence-verification.json
          cp \
            trusted-release-evidence/tag-external-evidence-verification.json \
            evidence/trusted-release-external-evidence-verification.json

      - name: Install current Chrome/Edge and pinned Playwright engines
        run: >-
          ./node_modules/.bin/playwright install --with-deps
          chromium chrome msedge firefox webkit

      - name: Build Pages directory from the verified draft HTML
        run: |
          mkdir pages-dist
          cp \
            draft-before-deploy/OrbitPM-Process-Studio-Lite-0.4.5.html \
            pages-dist/index.html

      - name: Re-download all assets immediately before packaging
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/check-release-tag.mjs "$RELEASE_TAG" --require-origin-main
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > draft-prepackage.json
          mkdir draft-prepackage
          gh release download "$RELEASE_TAG" --dir draft-prepackage
          node scripts/release-state.mjs \
            --release-json=draft-prepackage.json \
            --assets=draft-prepackage \
            --expected-assets=tag-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag="$RELEASE_TAG" \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=draft
          cmp \
            pages-dist/index.html \
            draft-prepackage/OrbitPM-Process-Studio-Lite-0.4.5.html

      - name: Package candidate Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          name: orbitpm-pages-candidate-${{ github.run_id }}
          path: pages-dist

      - name: Recheck release identity immediately before deployment
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/check-release-tag.mjs "$RELEASE_TAG" --require-origin-main
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > draft-at-deploy.json
          mkdir draft-at-deploy
          gh release download "$RELEASE_TAG" --dir draft-at-deploy
          node scripts/release-state.mjs \
            --release-json=draft-at-deploy.json \
            --assets=draft-at-deploy \
            --expected-assets=tag-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag="$RELEASE_TAG" \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=draft
          cmp \
            pages-dist/index.html \
            draft-at-deploy/OrbitPM-Process-Studio-Lite-0.4.5.html

      - name: Deploy candidate Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: orbitpm-pages-candidate-${{ github.run_id }}

      - name: Require the canonical production deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: test "$DEPLOYMENT_URL" = "https://ahmedak320.github.io/bpmn-studio/"

      - name: Record exact Pages browser environment evidence
        env:
          PAGES_URL: https://ahmedak320.github.io/bpmn-studio/
        run: >-
          node scripts/browser-environment-evidence.mjs
          --candidate-sha=${{ inputs.candidate_sha }}
          --artifact=pages-dist/index.html
          --url="$PAGES_URL"
          --browsers=chromium,chrome,edge,firefox,webkit-linux
          --fetch-attempts=150
          --fetch-delay-ms=5000
          --output=evidence/pages-browser-environment.json

      - name: Compare deployed bytes and smoke EN/AR
        env:
          PAGES_URL: https://ahmedak320.github.io/bpmn-studio/
        run: >-
          node scripts/pages-smoke.mjs
          --artifact=pages-dist/index.html
          --fetch-attempts=150
          --fetch-delay-ms=5000

      - name: Read back release bytes and identities immediately after deployment
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/check-release-tag.mjs "$RELEASE_TAG" --require-origin-main
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > draft-postdeploy.json
          mkdir draft-postdeploy
          gh release download "$RELEASE_TAG" --dir draft-postdeploy
          node scripts/release-state.mjs \
            --release-json=draft-postdeploy.json \
            --assets=draft-postdeploy \
            --expected-assets=tag-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag="$RELEASE_TAG" \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=draft
          cmp \
            pages-dist/index.html \
            draft-postdeploy/OrbitPM-Process-Studio-Lite-0.4.5.html

      - name: Preserve Pages approval and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-pages-evidence-${{ inputs.candidate_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  rollback:
    name: Restore verified v0.4.4 bytes after a failed deployment attempt
    needs: [identity, deploy]
    if: ${{ always() && needs.identity.result == 'success' && needs.deploy.result != 'success' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/pages-rollback.yml
    with:
      authority_sha: ${{ inputs.candidate_sha }}
      authority_tag: ${{ inputs.release_tag }}
      known_good_tag: ${{ inputs.rollback_tag }}
      known_good_commit_sha: ${{ inputs.rollback_commit_sha }}
      known_good_asset_name: ${{ inputs.rollback_asset_name }}
      known_good_asset_sha256: ${{ inputs.rollback_asset_sha256 }}
      automatic_rollback: true
