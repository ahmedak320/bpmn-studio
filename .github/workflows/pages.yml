name: Deploy Lite to GitHub Pages

# Builds the repository-root, self-contained browser application and publishes
# the exact tested artifact to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Allow the deploy job to mint a Pages deployment via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deployment at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify single-file artifact
        run: |
          npm run typecheck
          npm test
          npm run build
          test -f dist/index.html
          # Fail if the build somehow emitted extra assets (must be one file).
          count=$(find dist -type f | wc -l)
          echo "dist file count: $count"
          test "$count" -eq 1
          echo "index.html size: $(du -h dist/index.html | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
