            archive_tag_object="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/4fd3fa1e5b7025e1c7d3c280a058c120594be645"
            )"
            test "$(jq -r .object.type <<<"$archive_tag_object")" = "commit"
            test "$(jq -r .object.sha <<<"$archive_tag_object")" = \
              "cd842b6e0b8d7283e2704ae71ec207440b9e54f2"
