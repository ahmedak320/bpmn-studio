              --slurpfile manifest "$manifest" \
              '[
                $manifest[0].releases[] as $expectedRelease |
                $live[0][] |
                select(.id == $expectedRelease.releaseId) as $liveRelease |
                $expectedRelease.assets[] |
                select(.action == "delete") as $expectedAsset |
                $liveRelease.assets[] |
                select(.id == $expectedAsset.id) |
                .id
              ] | sort'
          )"
          planned_delete_ids="$(jq '[.assetDeletes[].id] | sort' "$plan")"
          jq -e \
            --argjson current "$current_delete_ids" \
            --argjson planned "$planned_delete_ids" \
            '($current - $planned) == []' \
            >/dev/null
          jq -r \
            '.releases[].assets[] | select(.action == "delete") | .id' \
            "$manifest" |
            while IFS= read -r asset_id; do
              bound="$(
                jq -c --argjson id "$asset_id" \
                  '.releases[].assets[] | select(.id == $id)' \
                  "$manifest"
              )"
              live="$(
                jq -c --argjson id "$asset_id" \
                  '.[] | .assets[] | select(.id == $id)' \
                  historical-before-delete.json
              )"
              if test -n "$live"; then
                test "$(jq -r .name <<<"$live")" = "$(jq -r .name <<<"$bound")"
                test "$(jq -r .size <<<"$live")" = "$(jq -r .size <<<"$bound")"
                test "$(jq -r .digest <<<"$live")" = \
                  "sha256:$(jq -r .sha256 <<<"$bound")"
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                  > asset-immediately-before-delete.json
                test "$(jq -r .name asset-immediately-before-delete.json)" = \
                  "$(jq -r .name <<<"$bound")"
                test "$(jq -r .size asset-immediately-before-delete.json)" = \
                  "$(jq -r .size <<<"$bound")"
                test "$(jq -r .digest asset-immediately-before-delete.json)" = \
                  "sha256:$(jq -r .sha256 <<<"$bound")"
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                  --method DELETE
              fi
            done

      - name: Read back mutation and unchanged stable Pages authority
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: https://ahmedak320.github.io/bpmn-studio/
        run: |
          set -euo pipefail
          manifest=cleanup-authority/historical-release-cleanup-manifest.json
          publication_authority=cleanup-authority/publication-authority.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s 'add' > historical-after-mutation.json
          jq -e --slurpfile manifest "$manifest" \
            '
              . as $releases |
              all($manifest[0].releases[];
                . as $expected |
                ($releases | map(select(.id == $expected.releaseId))) as $matches |
                ($matches | length) == 1 and
                $matches[0].name == ("[ARCHIVED] " + $expected.originalName) and
                all($expected.assets[] | select(.action == "delete");
                  .id as $id | all($matches[0].assets[]; .id != $id)
                ) and
                all($expected.assets[] | select(.action == "retain");
                  . as $asset |
                  any($matches[0].assets[];
                    .id == $asset.id and
                    .name == $asset.name and
                    .size == $asset.size and
                    .digest == ("sha256:" + $asset.sha256) and
                    .state == "uploaded"
                  )
                ) and
                all($matches[0].assets[];
                  .id as $id |
                  any($expected.assets[] | select(.action == "retain");
                    .id == $id
                  )
                )
              )
            ' historical-after-mutation.json >/dev/null
          main_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
          test "$(jq -r .object.sha <<<"$main_ref")" = "$CANDIDATE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.4.5" \
            > stable-after-mutation.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            > latest-after-mutation.json
          jq -e \
            --slurpfile authority "$publication_authority" \
            '
              .id == $authority[0].releaseId and
              .tag_name == "v0.4.5" and
              .target_commitish == $authority[0].candidateSha and
              .name == $authority[0].releaseTitle and
              .body == $authority[0].notesBody and
              .draft == false and
              .prerelease == false and
              .immutable == true and
              (.assets | length) == 7
            ' stable-after-mutation.json >/dev/null
          test "$(jq -r .id stable-after-mutation.json)" = \
            "$(jq -r .id latest-after-mutation.json)"
          html_sha="$(
            jq -r \
              '.assets[] |
                select(.name == "OrbitPM-Process-Studio-Lite-0.4.5.html") |
                .sha256' \
              "$publication_authority"
          )"
          html_id="$(
            jq -r \
              '.assets[] |
                select(.name == "OrbitPM-Process-Studio-Lite-0.4.5.html") |
                .id' \
              stable-after-mutation.json
          )"
          gh api --header 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$html_id" \
            > stable-after-mutation.html
          test "$(sha256sum stable-after-mutation.html | cut -d' ' -f1)" = "$html_sha"
          cmp stable-after-mutation.html cleanup-authority/stable.html
          response="$(
            curl --fail --silent --show-error \
              --max-redirs 0 \
              --max-time 30 \
              --max-filesize 33554432 \
              --write-out '%{http_code}\t%{url_effective}' \
              "$PAGES_URL" \
              --output pages-after-mutation.html
          )"
          test "$response" = "$(printf '200\t%s' "$PAGES_URL")"
          cmp stable-after-mutation.html pages-after-mutation.html
          jq -n \
            --arg candidateSha "$CANDIDATE_SHA" \
            '{
              schemaVersion: 1,
              gate: "orbitpm-lite-historical-cleanup-mutation",
              status: "passed",
              candidateSha: $candidateSha,
              deletedAssetCount: 28,
              retainedAssetCount: 7
            }' > historical-mutation-receipt.json

  readback:
    name: Read-only cleanup evidence and canonical Pages read-back
    needs: [plan, cleanup]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact stable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Download immutable cleanup authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: orbitpm-historical-cleanup-authority-${{ github.run_id }}
          path: cleanup-authority

      - name: Verify exact post-cleanup state, inherited evidence, tags, and Pages
        env:
          ARCHIVE_EVIDENCE_SHA256: ${{ inputs.archive_evidence_sha256 }}
          ARCHIVE_EVIDENCE_URL: ${{ inputs.archive_evidence_url }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FINALIZATION_RUN_ID: ${{ inputs.finalization_run_id }}
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: https://ahmedak320.github.io/bpmn-studio/
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          authority=cleanup-authority/cleanup-authority.json
          archive_recovery=cleanup-authority/archive-recovery-verification.json
          test "$(sha256sum "$archive_recovery" | cut -d' ' -f1)" = \
            "$(jq -r .archiveRecoveryEvidence.verificationSha256 "$authority")"
          test "$(jq -r .candidateSha "$archive_recovery")" = "$CANDIDATE_SHA"
          test "$(jq -r .source.url "$archive_recovery")" = "$ARCHIVE_EVIDENCE_URL"
          test "$(jq -r .source.finalUrl "$archive_recovery")" = "$ARCHIVE_EVIDENCE_URL"
          test "$(jq -r .source.sha256 "$archive_recovery")" = \
            "$ARCHIVE_EVIDENCE_SHA256"
          manifest=cleanup-authority/historical-release-cleanup-manifest.json
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = \
            "484fa611b1bdd4494ef48e2e77ef1d672c1a1a7f769e8ff431a8f911513407d8"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s 'add' > historical-after.json
          node scripts/historical-release-cleanup.mjs \
            --mode=verify \
            --manifest="$manifest" \
            --releases=historical-after.json \
            --output=historical-verification.json
          test "$(jq -r .expectedDeletionCount historical-verification.json)" = "28"
          test "$(jq -r .remainingDeletionCount historical-verification.json)" = "0"
          test "$(jq -r .retainedAssetCount historical-verification.json)" = "7"
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/archive/full-product-v0.4.4:refs/remotes/origin/archive/full-product-v0.4.4 \
            '+refs/tags/*:refs/tags/*'
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/archive/full-product-v0.4.4)" = \
            "cd842b6e0b8d7283e2704ae71ec207440b9e54f2"
          test "$(git cat-file -t refs/tags/archive-full-product-v0.4.4)" = "tag"
          test "$(git rev-parse refs/tags/archive-full-product-v0.4.4)" = \
            "4fd3fa1e5b7025e1c7d3c280a058c120594be645"
          test "$(git rev-parse "refs/tags/archive-full-product-v0.4.4^{commit}")" = \
            "cd842b6e0b8d7283e2704ae71ec207440b9e54f2"
          verify_readback_bundle() {
            bundle_name="$1"
            commit_sha="$2"
            bundle_path="$PWD/cleanup-authority/$bundle_name"
            verification_repo="$RUNNER_TEMP/readback-verify-${bundle_name%.bundle}.git"
            recovery_clone="$RUNNER_TEMP/readback-recover-${bundle_name%.bundle}"
            git init --bare "$verification_repo" >/dev/null
            git -C "$verification_repo" bundle verify "$bundle_path"
            git -c core.hooksPath=/dev/null clone \
              --no-checkout \
              --no-hardlinks \
              "$bundle_path" \
              "$recovery_clone"
            git -C "$recovery_clone" -c core.hooksPath=/dev/null checkout \
              --detach "$commit_sha"
            test "$(git -C "$recovery_clone" rev-parse HEAD)" = "$commit_sha"
            git -C "$recovery_clone" fsck --full
          }
          verify_readback_bundle \
            bpmn-studio-full-product-v0.4.4.bundle \
            cd842b6e0b8d7283e2704ae71ec207440b9e54f2
          verify_readback_bundle \
            bpmn-tool-outer-legacy-v0.4.4.bundle \
            b1b288939e39c5dd9c2e064f76e24c85ad519fac
          node scripts/check-release-tag.mjs "$RELEASE_TAG" --require-origin-main
          jq -r \
            '.releases[] | [.tag, .tagRefSha, .peeledCommitSha] | @tsv' \
            "$manifest" |
            while IFS=$'\t' read -r tag ref_sha commit_sha; do
              test "$(git rev-parse "refs/tags/$tag")" = "$ref_sha"
              test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$commit_sha"
            done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > stable-after-cleanup.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            > latest-after-cleanup.json
          test "$(jq -r .id stable-after-cleanup.json)" = \
            "$(jq -r .id latest-after-cleanup.json)"
          mkdir stable-after-cleanup
          gh release download "$RELEASE_TAG" --dir stable-after-cleanup
          node scripts/release-state.mjs \
            --release-json=stable-after-cleanup.json \
            --assets=stable-after-cleanup \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag="$RELEASE_TAG" \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=stable
          artifact=stable-after-cleanup/OrbitPM-Process-Studio-Lite-0.4.5.html
          cmp "$artifact" cleanup-authority/stable.html
          response="$(
            curl --fail --silent --show-error \
              --max-redirs 0 \
              --max-time 30 \
              --max-filesize 33554432 \
              --write-out '%{http_code}\t%{url_effective}' \
              "$PAGES_URL" \
              --output pages-after-cleanup.html
          )"
          test "$response" = "$(printf '200\t%s' "$PAGES_URL")"
          cmp "$artifact" pages-after-cleanup.html

      - name: Verify retained finalization and baseline bytes without refetch
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FINALIZATION_RUN_ID: ${{ inputs.finalization_run_id }}
          PAGES_URL: https://ahmedak320.github.io/bpmn-studio/
        run: |
          chain=cleanup-authority/finalization-chain.json
          browser_evidence=cleanup-authority/browser-compatibility-evidence-verification.json
          release_evidence=cleanup-authority/trusted-release-external-evidence-verification.json
          pages_evidence=cleanup-authority/pages-browser-environment.json
          pages_release_evidence=cleanup-authority/trusted-pages-release-external-evidence-verification.json
          publication_authority=cleanup-authority/publication-authority.json
          artifact=stable-after-cleanup/OrbitPM-Process-Studio-Lite-0.4.5.html
          test "$(jq -r .schemaVersion "$chain")" = "2"
          test "$(jq -r .candidateSha "$chain")" = "$CANDIDATE_SHA"
          test "$(jq -r .finalizationRunId "$chain")" = "$FINALIZATION_RUN_ID"
          test "$(jq -r .artifactSha256 "$chain")" = \
            "$(sha256sum "$artifact" | cut -d' ' -f1)"
          test "$(jq -r .publicationAuthoritySha256 "$chain")" = \
            "$(sha256sum "$publication_authority" | cut -d' ' -f1)"
          test "$(jq -r .browserCompatibilityEvidence.aggregateSha256 "$chain")" = \
            "$(sha256sum "$browser_evidence" | cut -d' ' -f1)"
          test "$(jq -r .browserVersionBaseline.url "$chain")" = \
            "$(jq -r .versionBaseline.source.url "$browser_evidence")"
          test "$(jq -r .browserVersionBaseline.sha256 "$chain")" = \
            "$(jq -r .versionBaseline.source.sha256 "$browser_evidence")"
          test "$(jq -r .browserVersionBaseline.sourceSha256 "$chain")" = \
            "$(jq -r .versionBaseline.source.sha256 "$browser_evidence")"
          test "$(jq -r .versionBaseline.source.url "$browser_evidence")" = \
            "$(jq -r .versionBaseline.source.finalUrl "$browser_evidence")"
          verify_embedded_record() {
            record="$1"
            output="$2"
            jq -j .bodyBase64 <<<"$record" | base64 --decode > "$output"
            test "$(stat --format=%s "$output")" = "$(jq -r .sizeBytes <<<"$record")"
            test "$(sha256sum "$output" | cut -d' ' -f1)" = \
              "$(jq -r .sha256 <<<"$record")"
          }
          matrix_source="$(jq -c .source "$browser_evidence")"
          test "$(jq -r .url <<<"$matrix_source")" = \
            "$(jq -r .finalUrl <<<"$matrix_source")"
          verify_embedded_record "$matrix_source" matrix-source-readback.json
          baseline_source="$(jq -c .versionBaseline.source "$browser_evidence")"
          verify_embedded_record "$baseline_source" baseline-source-readback.json
          pages_source="$(jq -c .pagesDeploymentEvidence "$browser_evidence")"
          verify_embedded_record "$pages_source" pages-source-readback.json
          test "$(jq '.versionBaseline.officialSources | length' "$browser_evidence")" -eq 4
          test "$(
            jq -r '.versionBaseline.officialSources[].browser' "$browser_evidence" | sort
          )" = "$(
            printf '%s\n' chrome edge firefox safari
          )"
          jq -e \
            '
              .versionBaseline.officialSources as $sources |
              ([$sources[] | select(
                .id == "chrome-stable" and
                .browser == "chrome" and
                .url == .finalUrl and
                (.url | test("^https://versionhistory[.]googleapis[.]com/v1/chrome/platforms/(win|win64|mac|mac_arm64|linux)/channels/stable/versions/all/releases[?]page_size=10000$"))
              )] | length) == 1 and
              ([$sources[] | select(
                .id == "edge-stable" and
                .browser == "edge" and
                .url == "https://learn.microsoft.com/en-us/deployedge/microsoft-edge-relnote-stable-channel" and
                .url == .finalUrl
              )] | length) == 1 and
              ([$sources[] | select(
                .id == "firefox-stable" and
                .browser == "firefox" and
                .url == "https://product-details.mozilla.org/1.0/firefox.json" and
                .url == .finalUrl
              )] | length) == 1 and
              ([$sources[] | select(
                .id == "safari-stable" and
                .browser == "safari" and
                .url == "https://support.apple.com/en-us/100100" and
                .url == .finalUrl
              )] | length) == 1
            ' "$browser_evidence" >/dev/null
          source_index=0
          jq -c '.versionBaseline.officialSources[]' "$browser_evidence" |
            while IFS= read -r source; do
              source_index=$((source_index + 1))
              verify_embedded_record "$source" "official-source-readback-$source_index"
            done
          candidate_ready_at="$(jq -er .candidateReadyAt "$chain")"
          pages_run_id="$(jq -er .pagesRunId "$chain")"
          node scripts/release-evidence-chain.mjs verify \
            --aggregate="$release_evidence" \
            --candidate-sha="$CANDIDATE_SHA" \
            --candidate-ready-at="$candidate_ready_at" \
            --artifact="$artifact" \
            --source-url="$(jq -r .externalEvidence.url "$chain")" \
            --source-sha256="$(jq -r .externalEvidence.sha256 "$chain")"
          node scripts/release-evidence-chain.mjs compare \
            --trusted="$release_evidence" \
            --observed="$pages_release_evidence"
          node scripts/pages-evidence-chain.mjs verify \
            --evidence="$pages_evidence" \
            --candidate-sha="$CANDIDATE_SHA" \
            --artifact="$artifact" \
            --url="$PAGES_URL" \
            --run-id="$pages_run_id" \
            --repository="$GITHUB_REPOSITORY"

      - name: Preserve cleanup plan and verified read-back
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-historical-cleanup-${{ inputs.candidate_sha }}
          path: |
            cleanup-authority/archive-recovery-verification.json
            cleanup-authority/bpmn-studio-full-product-v0.4.4.bundle
            cleanup-authority/bpmn-tool-outer-legacy-v0.4.4.bundle
            cleanup-authority/cleanup-authority.json
            cleanup-authority/historical-plan-before.json
            historical-verification.json
          if-no-files-found: error
          retention-days: 90
