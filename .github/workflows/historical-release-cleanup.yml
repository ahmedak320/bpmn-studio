                .url == .finalUrl
              )] | length) == 1 and
              ([$sources[] | select(
                .id == "safari-stable" and
                .browser == "safari" and
                .url == "https://support.apple.com/en-us/100100" and
                .url == .finalUrl
              )] | length) == 1
            ' "$browser_evidence" >/dev/null
          source_index=0
          jq -c '.versionBaseline.officialSources[]' "$browser_evidence" |
