              ([.releases[].assets[] | select(.action == "retain")] | length) == 7
            ' "$manifest" >/dev/null
          test "$(jq -r .manifestSha256 "$plan")" = \
            "484fa611b1bdd4494ef48e2e77ef1d672c1a1a7f769e8ff431a8f911513407d8"
          test "$(jq -r .expectedDeletionCount "$plan")" = "28"
          test "$(jq -r .retainedAssetCount "$plan")" = "7"

      - name: Mutate only fresh manifest-bound releases and assets
        env:
          APPROVAL_POLICY: ${{ vars.ORBITPM_HISTORICAL_CLEANUP_POLICY }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: https://ahmedak320.github.io/bpmn-studio/
        run: |
          set -euo pipefail
          test "$APPROVAL_POLICY" = \
            "v0.4.5-immutable-stable-pages-verified-manifest-28-assets"
          archive_branch_ref="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/archive/full-product-v0.4.4"
          )"
          test "$(jq -r .object.type <<<"$archive_branch_ref")" = "commit"
          test "$(jq -r .object.sha <<<"$archive_branch_ref")" = \
            "cd842b6e0b8d7283e2704ae71ec207440b9e54f2"
          archive_tag_ref="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/archive-full-product-v0.4.4"
          )"
          test "$(jq -r .object.type <<<"$archive_tag_ref")" = "tag"
          test "$(jq -r .object.sha <<<"$archive_tag_ref")" = \
            "4fd3fa1e5b7025e1c7d3c280a058c120594be645"
          archive_tag_object="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/4fd3fa1e5b7025e1c7d3c280a058c120594be645"
          )"
          test "$(jq -r .object.type <<<"$archive_tag_object")" = "commit"
          test "$(jq -r .object.sha <<<"$archive_tag_object")" = \
            "cd842b6e0b8d7283e2704ae71ec207440b9e54f2"
          manifest=cleanup-authority/historical-release-cleanup-manifest.json
          publication_authority=cleanup-authority/publication-authority.json
          validate_stable_and_pages() {
            main_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
            test "$(jq -r .object.sha <<<"$main_ref")" = "$CANDIDATE_SHA"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.4.5" \
              > stable-live.json
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-live.json
            jq -e \
              --slurpfile authority "$publication_authority" \
              '
                .id == $authority[0].releaseId and
                .tag_name == "v0.4.5" and
                .target_commitish == $authority[0].candidateSha and
                .name == $authority[0].releaseTitle and
                .body == $authority[0].notesBody and
                .draft == false and
                .prerelease == false and
                .immutable == true and
                (.assets | length) == 7
              ' stable-live.json >/dev/null
            test "$(jq -r .id stable-live.json)" = "$(jq -r .id latest-live.json)"
            html_sha="$(
              jq -r \
                '.assets[] |
                  select(.name == "OrbitPM-Process-Studio-Lite-0.4.5.html") |
                  .sha256' \
                "$publication_authority"
            )"
            html_id="$(
              jq -r \
                '.assets[] |
                  select(.name == "OrbitPM-Process-Studio-Lite-0.4.5.html") |
                  .id' \
                stable-live.json
            )"
            gh api --header 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$html_id" \
              > stable-live.html
            test "$(sha256sum stable-live.html | cut -d' ' -f1)" = "$html_sha"
            cmp stable-live.html cleanup-authority/stable.html
            response="$(
              curl --fail --silent --show-error \
                --max-redirs 0 \
                --max-time 30 \
                --max-filesize 33554432 \
                --write-out '%{http_code}\t%{url_effective}' \
                "$PAGES_URL" \
                --output pages-live.html
            )"
            test "$response" = "$(printf '200\t%s' "$PAGES_URL")"
            cmp stable-live.html pages-live.html
          }
          validate_stable_and_pages
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s 'add' > historical-live.json
          jq -e --slurpfile manifest "$manifest" \
            '
              ($manifest[0].releases | map(.tag)) + [$manifest[0].stableReleaseTag] as $allowed |
              all(.[];
                if ($allowed | index(.tag_name)) != null then true
                else
                  all(.assets[];
                    (.name | ascii_downcase) as $name |
                    $name != "latest.yml" and
                    ($name | endswith("." + "exe") | not) and
                    ($name | endswith("." + "exe." + "blockmap") | not)
                  )
                end
              )
            ' historical-live.json >/dev/null
          jq -r '.releases[] | @base64' "$manifest" |
            while IFS= read -r encoded; do
              entry="$(printf '%s' "$encoded" | base64 --decode)"
              release_id="$(jq -r .releaseId <<<"$entry")"
              tag="$(jq -r .tag <<<"$entry")"
              ref_sha="$(jq -r .tagRefSha <<<"$entry")"
              commit_sha="$(jq -r .peeledCommitSha <<<"$entry")"
              ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
              test "$(jq -r .object.sha <<<"$ref_json")" = "$ref_sha"
              if test "$(jq -r .object.type <<<"$ref_json")" = "tag"; then
                tag_json="$(
                  gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref_json")"
                )"
                test "$(jq -r .object.type <<<"$tag_json")" = "commit"
                test "$(jq -r .object.sha <<<"$tag_json")" = "$commit_sha"
              else
                test "$(jq -r .object.type <<<"$ref_json")" = "commit"
                test "$ref_sha" = "$commit_sha"
              fi
              release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
              test "$(jq -r .tag_name <<<"$release_json")" = "$tag"
              test "$(jq -r .draft <<<"$release_json")" = "$(jq -r .draft <<<"$entry")"
              test "$(jq -r .prerelease <<<"$release_json")" = \
                "$(jq -r .prerelease <<<"$entry")"
              test "$(jq -r .immutable <<<"$release_json")" = "false"
              jq -e \
                --argjson live "$release_json" \
                --argjson expected "$entry" \
                '
                  all($live.assets[];
                    .id as $id |
                    [.name, .size, .digest, .state] as $identity |
                    any($expected.assets[];
                      .id == $id and
                      [.name, .size, ("sha256:" + .sha256), "uploaded"] == $identity
                    )
                  ) and
                  all($expected.assets[] | select(.action == "retain");
                    . as $asset |
                    any($live.assets[];
                      .id == $asset.id and
                      .name == $asset.name and
                      .size == $asset.size and
                      .digest == ("sha256:" + $asset.sha256) and
                      .state == "uploaded"
                    )
                  )
                ' >/dev/null
              original_name="$(jq -r .originalName <<<"$entry")"
              original_sha="$(jq -r .originalBodySha256 <<<"$entry")"
              notice="$(jq -r .archivalNotice "$manifest")"
              live_name="$(jq -r .name <<<"$release_json")"
              if test "$live_name" = "$original_name"; then
                jq -j '.body // ""' <<<"$release_json" > original-body.txt
                test "$(sha256sum original-body.txt | cut -d' ' -f1)" = "$original_sha"
                jq -n \
                  --arg name "[ARCHIVED] $original_name" \
                  --arg notice "$notice" \
                  --rawfile original original-body.txt \
                  '{
                    name: $name,
                    body: (
                      if ($original | length) == 0 then $notice
                      else $notice + "\n\n" + $original
                      end
                    )
                  }' |
                  gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                    --method PATCH \
                    --input - \
                    >/dev/null
              else
                test "$live_name" = "[ARCHIVED] $original_name"
              fi
              release_after="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
              test "$(jq -r .name <<<"$release_after")" = "[ARCHIVED] $original_name"
              jq -j --arg notice "$notice" \
                '
                  (.body // "") as $body |
                  if $body == $notice then ""
                  elif ($body | startswith($notice + "\n\n")) then
                    $body[($notice | length) + 2:]
                  else error("archived body does not preserve the manifest notice")
                  end
                ' <<<"$release_after" > recovered-body.txt
              test "$(sha256sum recovered-body.txt | cut -d' ' -f1)" = "$original_sha"
            done

