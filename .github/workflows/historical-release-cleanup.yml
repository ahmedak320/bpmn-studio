name: Archive historical releases after immutable stable verification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact origin/main commit peeled from stable v0.4.5
        required: true
        type: string
      release_tag:
        description: Published immutable stable release tag
        required: true
        default: v0.4.5
        type: string
      finalization_run_id:
        description: Successful protected immutable finalization workflow run ID
        required: true
        type: string
      archive_evidence_url:
        description: Candidate-pinned immutable legacy archive recovery manifest URL
        required: true
        type: string
      archive_evidence_sha256:
        description: SHA-256 of the immutable legacy archive recovery manifest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: orbitpm-release-lifecycle-v0.4.5
  cancel-in-progress: false

jobs:
  plan:
    name: Read-only stable verification and immutable cleanup plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      cleanup-authority-digest: ${{ steps.upload-authority.outputs.artifact-digest }}
      cleanup-authority-id: ${{ steps.upload-authority.outputs.artifact-id }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact stable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Verify finalization run and immutable Git identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FINALIZATION_RUN_ID: ${{ inputs.finalization_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$RELEASE_TAG" = "v0.4.5"
          test "${#CANDIDATE_SHA}" -eq 40
          case "$CANDIDATE_SHA" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          case "$FINALIZATION_RUN_ID" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/archive/full-product-v0.4.4:refs/remotes/origin/archive/full-product-v0.4.4 \
            '+refs/tags/*:refs/tags/*'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/archive/full-product-v0.4.4)" = \
            "cd842b6e0b8d7283e2704ae71ec207440b9e54f2"
          test "$(git cat-file -t refs/tags/archive-full-product-v0.4.4)" = "tag"
          test "$(git rev-parse refs/tags/archive-full-product-v0.4.4)" = \
            "4fd3fa1e5b7025e1c7d3c280a058c120594be645"
          test "$(git rev-parse "refs/tags/archive-full-product-v0.4.4^{commit}")" = \
            "cd842b6e0b8d7283e2704ae71ec207440b9e54f2"
          node scripts/check-release-tag.mjs "$RELEASE_TAG" --require-origin-main
          run_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FINALIZATION_RUN_ID"
          )"
          current_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r .name <<<"$run_json")" = \
            "Publish and verify immutable Lite stable release"
          test "$(jq -r .path <<<"$run_json")" = \
            ".github/workflows/release-finalize.yml"
          test "$(jq -r .event <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .head_sha <<<"$run_json")" = "$CANDIDATE_SHA"
          test "$(jq -r .head_branch <<<"$run_json")" = "main"
          FINALIZED_AT="$(jq -r .updated_at <<<"$run_json")" \
            CLEANUP_STARTED_AT="$(jq -r .created_at <<<"$current_run_json")" \
            node --eval "
              const finalized = Date.parse(process.env.FINALIZED_AT)
              const cleanup = Date.parse(process.env.CLEANUP_STARTED_AT)
              if (!Number.isFinite(finalized) || !Number.isFinite(cleanup) || finalized >= cleanup) {
                throw new Error('Finalization must complete before historical cleanup starts.')
              }
            "
          artifacts_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FINALIZATION_RUN_ID/artifacts?per_page=100"
          )"
          evidence_name="orbitpm-immutable-stable-release-$CANDIDATE_SHA"
          test "$(
            jq --arg name "$evidence_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              <<<"$artifacts_json"
          )" -eq 1
          jq -r \
            '.releases[] | [.tag, .tagRefSha, .peeledCommitSha] | @tsv' \
            scripts/historical-release-cleanup-manifest.json |
            while IFS=$'\t' read -r tag ref_sha commit_sha; do
              test "$(git rev-parse "refs/tags/$tag")" = "$ref_sha"
              test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$commit_sha"
            done

      - name: Verify immutable legacy archive refs and recovery bundles
        env:
          ARCHIVE_EVIDENCE_SHA256: ${{ inputs.archive_evidence_sha256 }}
          ARCHIVE_EVIDENCE_URL: ${{ inputs.archive_evidence_url }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          node scripts/verify-archive-recovery-evidence.mjs \
            --candidate-sha="$CANDIDATE_SHA" \
            --url="$ARCHIVE_EVIDENCE_URL" \
            --sha256="$ARCHIVE_EVIDENCE_SHA256" \
            --bundles-dir=archive-recovery-bundles \
            --output=archive-recovery-verification.json

      - name: Download trusted immutable-finalization evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FINALIZATION_RUN_ID: ${{ inputs.finalization_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$FINALIZATION_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "orbitpm-immutable-stable-release-$CANDIDATE_SHA"
          --dir finalization-evidence

      - name: Verify stable chain, retained baseline, and canonical Pages bytes
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FINALIZATION_RUN_ID: ${{ inputs.finalization_run_id }}
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: https://ahmedak320.github.io/bpmn-studio/
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          chain=finalization-evidence/finalize-evidence/finalization-chain.json
          browser_evidence=finalization-evidence/finalize-evidence/browser-compatibility-evidence-verification.json
          release_evidence=finalization-evidence/finalize-evidence/trusted-release-external-evidence-verification.json
          pages_evidence=finalization-evidence/finalize-evidence/pages/pages-browser-environment.json
          pages_release_evidence=finalization-evidence/finalize-evidence/pages/trusted-release-external-evidence-verification.json
          publication_authority=finalization-evidence/publication-authority/publication-authority.json
          test "$(jq -r .schemaVersion "$chain")" = "2"
          test "$(jq -r .gate "$chain")" = "orbitpm-lite-finalization-chain"
          test "$(jq -r .status "$chain")" = "passed"
          test "$(jq -r .candidateSha "$chain")" = "$CANDIDATE_SHA"
          test "$(jq -r .releaseTag "$chain")" = "$RELEASE_TAG"
          test "$(jq -r .finalizationRunId "$chain")" = "$FINALIZATION_RUN_ID"
          test "$(jq -r .pagesUrl "$chain")" = "$PAGES_URL"
          test "$(jq -r .releaseEvidenceSha256 "$chain")" = \
            "$(sha256sum "$release_evidence" | cut -d' ' -f1)"
          test "$(jq -r .pagesEvidenceSha256 "$chain")" = \
            "$(sha256sum "$pages_evidence" | cut -d' ' -f1)"
          test "$(jq -r .publicationAuthoritySha256 "$chain")" = \
            "$(sha256sum "$publication_authority" | cut -d' ' -f1)"
          test "$(jq -r .browserCompatibilityEvidence.aggregateSha256 "$chain")" = \
            "$(sha256sum "$browser_evidence" | cut -d' ' -f1)"
          test "$(jq -r .browserCompatibilityEvidence.url "$chain")" = \
            "$(jq -r .source.url "$browser_evidence")"
          test "$(jq -r .browserCompatibilityEvidence.sourceSha256 "$chain")" = \
            "$(jq -r .source.sha256 "$browser_evidence")"
          test "$(jq -r .browserVersionBaseline.url "$chain")" = \
            "$(jq -r .versionBaseline.source.url "$browser_evidence")"
          test "$(jq -r .browserVersionBaseline.sha256 "$chain")" = \
            "$(jq -r .versionBaseline.source.sha256 "$browser_evidence")"
          test "$(jq -r .browserVersionBaseline.sourceSha256 "$chain")" = \
            "$(jq -r .versionBaseline.source.sha256 "$browser_evidence")"
          test "$(jq -r .versionBaseline.source.url "$browser_evidence")" = \
            "$(jq -r .versionBaseline.source.finalUrl "$browser_evidence")"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > stable-release.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-release.json
          test "$(jq -r .id stable-release.json)" = "$(jq -r .id latest-release.json)"
          test "$(jq -r .id stable-release.json)" = \
            "$(jq -r .id finalization-evidence/stable-release.json)"
          mkdir stable-release
          gh release download "$RELEASE_TAG" --dir stable-release
          node scripts/release-state.mjs \
            --release-json=stable-release.json \
            --assets=stable-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag="$RELEASE_TAG" \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=stable
          artifact=stable-release/OrbitPM-Process-Studio-Lite-0.4.5.html
          test "$(jq -r .artifactSha256 "$chain")" = \
            "$(sha256sum "$artifact" | cut -d' ' -f1)"
          response="$(
            curl --fail --silent --show-error \
              --max-redirs 0 \
              --max-time 30 \
              --max-filesize 33554432 \
              --write-out '%{http_code}\t%{url_effective}' \
              "$PAGES_URL" \
              --output pages-stable.html
          )"
          test "$response" = "$(printf '200\t%s' "$PAGES_URL")"
          cmp "$artifact" pages-stable.html
          candidate_ready_at="$(jq -er .candidateReadyAt "$chain")"
          pages_run_id="$(jq -er .pagesRunId "$chain")"
          case "$pages_run_id" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          node scripts/release-evidence-chain.mjs verify \
            --aggregate="$release_evidence" \
            --candidate-sha="$CANDIDATE_SHA" \
            --candidate-ready-at="$candidate_ready_at" \
            --artifact="$artifact" \
            --source-url="$(jq -r .externalEvidence.url "$chain")" \
            --source-sha256="$(jq -r .externalEvidence.sha256 "$chain")"
          node scripts/release-evidence-chain.mjs compare \
            --trusted="$release_evidence" \
            --observed="$pages_release_evidence"
          node scripts/pages-evidence-chain.mjs verify \
            --evidence="$pages_evidence" \
            --candidate-sha="$CANDIDATE_SHA" \
            --artifact="$artifact" \
            --url="$PAGES_URL" \
            --run-id="$pages_run_id" \
            --repository="$GITHUB_REPOSITORY"
          test "$(jq -r .candidateSha "$browser_evidence")" = "$CANDIDATE_SHA"
          test "$(jq -r .candidateReadyAt "$browser_evidence")" = "$candidate_ready_at"
          test "$(jq -r .artifactSha256 "$browser_evidence")" = \
            "$(jq -r .artifactSha256 "$chain")"
          test "$(jq -r .pagesUrl "$browser_evidence")" = "$PAGES_URL"
          test "$(jq -r .pagesDeploymentEvidence.sha256 "$browser_evidence")" = \
            "$(sha256sum "$pages_evidence" | cut -d' ' -f1)"

      - name: Build manifest-bound cleanup plan and fixed-data authority
        env:
          ARCHIVE_EVIDENCE_SHA256: ${{ inputs.archive_evidence_sha256 }}
          ARCHIVE_EVIDENCE_URL: ${{ inputs.archive_evidence_url }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FINALIZATION_RUN_ID: ${{ inputs.finalization_run_id }}
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: https://ahmedak320.github.io/bpmn-studio/
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s 'add' > historical-before.json
          node scripts/historical-release-cleanup.mjs \
            --mode=preflight \
            --manifest=scripts/historical-release-cleanup-manifest.json \
            --releases=historical-before.json \
            --output=historical-plan-before.json
          test "$(jq -r .manifestSha256 historical-plan-before.json)" = \
            "484fa611b1bdd4494ef48e2e77ef1d672c1a1a7f769e8ff431a8f911513407d8"
          test "$(jq -r .expectedDeletionCount historical-plan-before.json)" = "28"
          test "$(jq -r .retainedAssetCount historical-plan-before.json)" = "7"
          mkdir cleanup-authority
          cp \
            scripts/historical-release-cleanup-manifest.json \
            cleanup-authority/historical-release-cleanup-manifest.json
          cp historical-before.json cleanup-authority/historical-before.json
          cp historical-plan-before.json cleanup-authority/historical-plan-before.json
          cp \
            finalization-evidence/finalize-evidence/finalization-chain.json \
            cleanup-authority/finalization-chain.json
          cp \
            finalization-evidence/finalize-evidence/browser-compatibility-evidence-verification.json \
            cleanup-authority/browser-compatibility-evidence-verification.json
          cp \
            finalization-evidence/finalize-evidence/trusted-release-external-evidence-verification.json \
            cleanup-authority/trusted-release-external-evidence-verification.json
          cp \
            finalization-evidence/finalize-evidence/pages/pages-browser-environment.json \
            cleanup-authority/pages-browser-environment.json
          cp \
            finalization-evidence/finalize-evidence/pages/trusted-release-external-evidence-verification.json \
            cleanup-authority/trusted-pages-release-external-evidence-verification.json
          cp \
            finalization-evidence/publication-authority/publication-authority.json \
            cleanup-authority/publication-authority.json
          cp \
            stable-release/OrbitPM-Process-Studio-Lite-0.4.5.html \
            cleanup-authority/stable.html
          cp \
            archive-recovery-verification.json \
            cleanup-authority/archive-recovery-verification.json
          cp \
            archive-recovery-bundles/bpmn-studio-full-product-v0.4.4.bundle \
            cleanup-authority/bpmn-studio-full-product-v0.4.4.bundle
          cp \
            archive-recovery-bundles/bpmn-tool-outer-legacy-v0.4.4.bundle \
            cleanup-authority/bpmn-tool-outer-legacy-v0.4.4.bundle
          files="$(jq -n '[]')"
          for file in \
            archive-recovery-verification.json \
            bpmn-studio-full-product-v0.4.4.bundle \
            bpmn-tool-outer-legacy-v0.4.4.bundle \
            browser-compatibility-evidence-verification.json \
            finalization-chain.json \
            historical-before.json \
            historical-plan-before.json \
            historical-release-cleanup-manifest.json \
            pages-browser-environment.json \
            publication-authority.json \
            stable.html \
            trusted-pages-release-external-evidence-verification.json \
            trusted-release-external-evidence-verification.json
          do
            files="$(
              jq \
                --arg name "$file" \
                --arg sha256 "$(sha256sum "cleanup-authority/$file" | cut -d' ' -f1)" \
                --argjson size "$(stat --format=%s "cleanup-authority/$file")" \
                '. + [{name: $name, size: $size, sha256: $sha256}]' \
                <<<"$files"
            )"
          done
          chain=cleanup-authority/finalization-chain.json
          archive_recovery=cleanup-authority/archive-recovery-verification.json
          jq -n \
            --arg archiveEvidenceSha256 "$ARCHIVE_EVIDENCE_SHA256" \
            --arg archiveEvidenceUrl "$ARCHIVE_EVIDENCE_URL" \
            --arg archiveVerificationSha256 \
              "$(sha256sum "$archive_recovery" | cut -d' ' -f1)" \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg finalizationRunId "$FINALIZATION_RUN_ID" \
            --arg pagesUrl "$PAGES_URL" \
            --arg releaseTag "$RELEASE_TAG" \
            --argjson files "$files" \
            --slurpfile archiveRecovery "$archive_recovery" \
            --slurpfile chain "$chain" \
            '{
              schemaVersion: 1,
              gate: "orbitpm-lite-historical-cleanup-authority",
              status: "passed",
              candidateSha: $candidateSha,
              releaseTag: $releaseTag,
              finalizationRunId: $finalizationRunId,
              pagesUrl: $pagesUrl,
              manifestSha256: "484fa611b1bdd4494ef48e2e77ef1d672c1a1a7f769e8ff431a8f911513407d8",
              expectedDeletionCount: 28,
              retainedAssetCount: 7,
              archiveRecoveryEvidence: {
                url: $archiveEvidenceUrl,
                sourceSha256: $archiveEvidenceSha256,
                verificationSha256: $archiveVerificationSha256,
                archiveBranch: $archiveRecovery[0].archiveBranch,
                archiveTag: $archiveRecovery[0].archiveTag,
                bundles: $archiveRecovery[0].bundles
              },
              browserCompatibilityEvidence: $chain[0].browserCompatibilityEvidence,
              browserVersionBaseline: $chain[0].browserVersionBaseline,
              files: ($files | sort_by(.name))
            }' > cleanup-authority/cleanup-authority.json

      - name: Upload immutable cleanup authority
        id: upload-authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-historical-cleanup-authority-${{ github.run_id }}
          path: cleanup-authority/
          if-no-files-found: error
          retention-days: 90

  cleanup:
    name: Protected fixed-shell manifest-bound mutation
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: orbitpm-pages-deployment
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    environment:
      name: historical-release-cleanup-v0.4.5
    steps:
      - name: Fetch and bind the exact immutable cleanup authority
        env:
          ARCHIVE_EVIDENCE_SHA256: ${{ inputs.archive_evidence_sha256 }}
          ARCHIVE_EVIDENCE_URL: ${{ inputs.archive_evidence_url }}
          AUTHORITY_ARTIFACT_DIGEST: ${{ needs.plan.outputs.cleanup-authority-digest }}
          AUTHORITY_ARTIFACT_ID: ${{ needs.plan.outputs.cleanup-authority-id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$AUTHORITY_ARTIFACT_ID" in
            '' | *[!0-9]*) exit 1 ;;
          esac
          case "$AUTHORITY_ARTIFACT_DIGEST" in
            sha256:[0-9a-f][0-9a-f]*) expected_digest="$AUTHORITY_ARTIFACT_DIGEST" ;;
            [0-9a-f][0-9a-f]*) expected_digest="sha256:$AUTHORITY_ARTIFACT_DIGEST" ;;
            *) exit 1 ;;
          esac
          test "${#expected_digest}" -eq 71
          authority_name="orbitpm-historical-cleanup-authority-$GITHUB_RUN_ID"
          api_version=2026-03-10
          gh api --header "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTHORITY_ARTIFACT_ID" \
            > cleanup-artifact.json
          gh api --paginate --header "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
            jq -s '[.[].artifacts[]]' > run-artifacts.json
          jq -e \
            --argjson id "$AUTHORITY_ARTIFACT_ID" \
            --arg name "$authority_name" \
            --argjson run "$GITHUB_RUN_ID" \
            --arg sha "$CANDIDATE_SHA" \
            --arg digest "$expected_digest" \
            '
              .id == $id and
              .name == $name and
              .expired == false and
              .workflow_run.id == $run and
              .workflow_run.head_sha == $sha and
              .digest == $digest and
              .size_in_bytes > 0 and
              .size_in_bytes <= 16777216
            ' cleanup-artifact.json >/dev/null
          jq -e \
            --argjson id "$AUTHORITY_ARTIFACT_ID" \
            --arg name "$authority_name" \
            '
              [.[] | select(.name == $name)] as $matches |
              ($matches | length) == 1 and
              $matches[0].id == $id and
              $matches[0].expired == false
            ' run-artifacts.json >/dev/null
          curl --fail --silent --show-error --location \
            --proto '=https' \
            --proto-redir '=https' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: $api_version" \
            "${GITHUB_API_URL%/}/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTHORITY_ARTIFACT_ID/zip" \
            --output cleanup-authority.zip
          test "$(stat --format=%s cleanup-authority.zip)" = \
            "$(jq -r .size_in_bytes cleanup-artifact.json)"
          test "sha256:$(sha256sum cleanup-authority.zip | cut -d' ' -f1)" = \
            "$expected_digest"
          expected_entries="$(
            printf '%s\n' \
              archive-recovery-verification.json \
              bpmn-studio-full-product-v0.4.4.bundle \
              bpmn-tool-outer-legacy-v0.4.4.bundle \
              browser-compatibility-evidence-verification.json \
              cleanup-authority.json \
              finalization-chain.json \
              historical-before.json \
              historical-plan-before.json \
              historical-release-cleanup-manifest.json \
              pages-browser-environment.json \
              publication-authority.json \
              stable.html \
              trusted-pages-release-external-evidence-verification.json \
              trusted-release-external-evidence-verification.json
          )"
          test "$(unzip -Z1 cleanup-authority.zip | sort)" = "$expected_entries"
          mkdir cleanup-authority
          unzip -q cleanup-authority.zip -d cleanup-authority
          authority=cleanup-authority/cleanup-authority.json
          manifest=cleanup-authority/historical-release-cleanup-manifest.json
          plan=cleanup-authority/historical-plan-before.json
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = \
            "484fa611b1bdd4494ef48e2e77ef1d672c1a1a7f769e8ff431a8f911513407d8"
          jq -e \
            --arg archiveEvidenceSha256 "$ARCHIVE_EVIDENCE_SHA256" \
            --arg archiveEvidenceUrl "$ARCHIVE_EVIDENCE_URL" \
            --arg candidate "$CANDIDATE_SHA" \
            --arg finalizationRunId "${{ inputs.finalization_run_id }}" \
            '
              .schemaVersion == 1 and
              .gate == "orbitpm-lite-historical-cleanup-authority" and
              .status == "passed" and
              .candidateSha == $candidate and
              .releaseTag == "v0.4.5" and
              .finalizationRunId == $finalizationRunId and
              .pagesUrl == "https://ahmedak320.github.io/bpmn-studio/" and
              .manifestSha256 == "484fa611b1bdd4494ef48e2e77ef1d672c1a1a7f769e8ff431a8f911513407d8" and
              .expectedDeletionCount == 28 and
              .retainedAssetCount == 7 and
              .archiveRecoveryEvidence.url == $archiveEvidenceUrl and
              .archiveRecoveryEvidence.sourceSha256 == $archiveEvidenceSha256 and
              (.archiveRecoveryEvidence.verificationSha256 | test("^[0-9a-f]{64}$")) and
              (.browserCompatibilityEvidence.aggregateSha256 | test("^[0-9a-f]{64}$")) and
              (.browserVersionBaseline.sha256 | test("^[0-9a-f]{64}$")) and
              (.browserVersionBaseline.sourceSha256 == .browserVersionBaseline.sha256) and
              (.files | length) == 13 and
              ([.files[].name] | sort) == [
                "archive-recovery-verification.json",
                "bpmn-studio-full-product-v0.4.4.bundle",
                "bpmn-tool-outer-legacy-v0.4.4.bundle",
                "browser-compatibility-evidence-verification.json",
                "finalization-chain.json",
                "historical-before.json",
                "historical-plan-before.json",
                "historical-release-cleanup-manifest.json",
                "pages-browser-environment.json",
                "publication-authority.json",
                "stable.html",
                "trusted-pages-release-external-evidence-verification.json",
                "trusted-release-external-evidence-verification.json"
              ]
            ' "$authority" >/dev/null
          while IFS=$'\t' read -r name size sha256; do
            test "$name" = "$(basename "$name")"
