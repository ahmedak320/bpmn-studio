          verify_embedded_record "$matrix_source" matrix-source.json
          baseline_source="$(jq -c .versionBaseline.source "$browser_evidence")"
          test "$(jq -r .url <<<"$baseline_source")" = \
            "$(jq -r .finalUrl <<<"$baseline_source")"
          verify_embedded_record "$baseline_source" version-baseline.json
          test "$(jq -r .browserVersionBaseline.sourceSha256 "$chain")" = \
