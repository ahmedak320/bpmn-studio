name: Create annotated tag and draft Lite release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact origin/main merge commit verified by the pre-tag candidate workflow
        required: true
        type: string
      pretag_run_id:
        description: Successful Verify pre-tag Lite release candidate workflow run ID
        required: true
        type: string
      external_evidence_url:
        description: Reviewed NVDA, VoiceOver, Arabic, 48-hour soak, and P0/P1 evidence URL
        required: true
        type: string
      external_evidence_sha256:
        description: SHA-256 of the candidate-bound external evidence JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: orbitpm-release-lifecycle-v0.4.5
  cancel-in-progress: false

jobs:
  verify-pretag:
    name: Verify earlier merge-SHA candidate evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      candidate_ready_at: ${{ steps.pretag_binding.outputs.candidate_ready_at }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact current origin/main and immutable tag identity if resumed
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
          PRETAG_RUN_ID: ${{ inputs.pretag_run_id }}
        run: |
          test "${#CANDIDATE_SHA}" -eq 40
          case "$CANDIDATE_SHA" in
            *[!0-9a-fA-F]*)
              echo "candidate_sha must contain exactly 40 hexadecimal characters" >&2
              exit 1
              ;;
          esac
          case "$PRETAG_RUN_ID" in
            '' | *[!0-9]*)
              echo "pretag_run_id must be a numeric GitHub Actions run ID" >&2
              exit 1
              ;;
          esac
          case "$EVIDENCE_URL" in
            https://?*) ;;
            *)
              echo "external_evidence_url must be an HTTPS evidence location" >&2
              exit 1
              ;;
          esac
          test "${#EVIDENCE_SHA256}" -eq 64
          case "$EVIDENCE_SHA256" in
            *[!0-9a-fA-F]*)
              echo "external_evidence_sha256 must contain 64 hexadecimal characters" >&2
              exit 1
              ;;
          esac
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            '+refs/tags/*:refs/tags/*'
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          if git show-ref --verify --quiet refs/tags/v0.4.5; then
            test "$(git cat-file -t refs/tags/v0.4.5)" = "tag"
            test "$(git rev-parse 'refs/tags/v0.4.5^{commit}')" = "$CANDIDATE_SHA"
          fi

      - name: Verify successful earlier pre-tag workflow and candidate artifact identity
        id: pretag_binding
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          PRETAG_RUN_ID: ${{ inputs.pretag_run_id }}
        run: |
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRETAG_RUN_ID")"
          current_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r .name <<<"$run_json")" = "Verify pre-tag Lite release candidate"
          test "$(jq -r .path <<<"$run_json")" = ".github/workflows/release-candidate.yml"
          test "$(jq -r .event <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -r .status <<<"$run_json")" = "completed"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .head_sha <<<"$run_json")" = "$CANDIDATE_SHA"
          test "$(jq -r .head_branch <<<"$run_json")" = "main"
          artifacts_json="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRETAG_RUN_ID/artifacts?per_page=100"
          )"
          test "$(jq -r .total_count <<<"$artifacts_json")" -le 100
          candidate_name="orbitpm-pretag-release-candidate-$CANDIDATE_SHA"
          candidate_artifact="$(
            jq --arg name "$candidate_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)]' \
              <<<"$artifacts_json"
          )"
          test "$(jq length <<<"$candidate_artifact")" -eq 1
          test "$(jq -r '.[0].workflow_run.id' <<<"$candidate_artifact")" = \
            "$PRETAG_RUN_ID"
          test "$(jq -r '.[0].workflow_run.head_sha' <<<"$candidate_artifact")" = \
            "$CANDIDATE_SHA"
          candidate_artifact_created_at="$(jq -r '.[0].created_at' <<<"$candidate_artifact")"
          candidate_ready_at_raw="$(jq -r .updated_at <<<"$run_json")"
          candidate_ready_at="$(
            CANDIDATE_READY_AT_RAW="$candidate_ready_at_raw" node --eval "
              const value = Date.parse(process.env.CANDIDATE_READY_AT_RAW)
              if (!Number.isFinite(value)) {
                throw new Error('Successful pre-tag completion is not a timestamp.')
              }
              process.stdout.write(new Date(value).toISOString())
            "
          )"
          ARTIFACT_CREATED_AT="$candidate_artifact_created_at" \
          PRETAG_STARTED_AT="$(jq -r .created_at <<<"$run_json")" \
            CANDIDATE_READY_AT="$candidate_ready_at" \
            PRETAG_COMPLETED_AT="$(jq -r .updated_at <<<"$run_json")" \
            RELEASE_STARTED_AT="$(jq -r .created_at <<<"$current_run_json")" \
            node --eval "
              const artifactCreated = Date.parse(process.env.ARTIFACT_CREATED_AT)
              const pretagStarted = Date.parse(process.env.PRETAG_STARTED_AT)
              const candidateReady = Date.parse(process.env.CANDIDATE_READY_AT)
              const pretagCompleted = Date.parse(process.env.PRETAG_COMPLETED_AT)
              const releaseStarted = Date.parse(process.env.RELEASE_STARTED_AT)
              if (
                ![artifactCreated, pretagStarted, candidateReady, pretagCompleted, releaseStarted]
                  .every(Number.isFinite) ||
                artifactCreated < pretagStarted ||
                artifactCreated > pretagCompleted ||
                candidateReady !== pretagCompleted ||
                pretagCompleted >= releaseStarted
              ) {
                throw new Error('Candidate readiness must equal trusted pre-tag completion.')
              }
            "
          echo "candidate_ready_at=$candidate_ready_at" >> "$GITHUB_OUTPUT"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: npm ci

      - name: Download earlier exact seven-asset candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          PRETAG_RUN_ID: ${{ inputs.pretag_run_id }}
        run: >-
          gh run download "$PRETAG_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "orbitpm-pretag-release-candidate-$CANDIDATE_SHA"
          --dir release

      - name: Clean rebuild, assemble, and compare exact candidate bytes
        run: |
          npm run clean:dist
          npm run build
          npm run release:assemble -- --html dist/index.html --out release-repro
          npm run release:verify -- release
          npm run release:verify -- release-repro
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 7
          for candidate in release/*; do
            name="$(basename "$candidate")"
            cmp "$candidate" "release-repro/$name"
          done

      - name: Verify candidate-bound external human and soak evidence
        env:
          EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
        run: >-
          node scripts/verify-external-release-evidence.mjs
          --candidate-sha=${{ inputs.candidate_sha }}
          --candidate-ready-at=${{ steps.pretag_binding.outputs.candidate_ready_at }}
          --artifact=release/OrbitPM-Process-Studio-Lite-0.4.5.html
          --url="$EVIDENCE_URL"
          --sha256="$EVIDENCE_SHA256"
          --output=release-evidence/external-evidence-verification.json

      - name: Verify retained aggregate binds the trusted candidate-ready instant
        env:
          EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
        run: >-
          node scripts/release-evidence-chain.mjs verify
          --aggregate=release-evidence/external-evidence-verification.json
          --candidate-sha=${{ inputs.candidate_sha }}
          --candidate-ready-at=${{ steps.pretag_binding.outputs.candidate_ready_at }}
          --artifact=release/OrbitPM-Process-Studio-Lite-0.4.5.html
          --source-url="$EVIDENCE_URL"
          --source-sha256="$EVIDENCE_SHA256"

      - name: Install Chromium for independent exact file smoke
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Re-smoke exact candidate
        run: npm run release:file-smoke -- release/OrbitPM-Process-Studio-Lite-0.4.5.html

      - name: Preserve verified candidate for protected release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-verified-release-candidate-${{ inputs.candidate_sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve verified external evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-verified-external-evidence-${{ inputs.candidate_sha }}
          path: release-evidence/external-evidence-verification.json
          if-no-files-found: error
          retention-days: 90

      - name: Build immutable fixed-data authority for the isolated draft writer
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          mkdir release-authority
          cp docs/RELEASE_NOTES_0.4.5.md release-authority/release-notes.md
          assets="$(
            for path in release/*; do
              name="$(basename "$path")"
              jq -n \
                --arg name "$name" \
                --arg sha256 "$(sha256sum "$path" | cut -d' ' -f1)" \
                --argjson size "$(stat --format=%s "$path")" \
                '{name: $name, size: $size, sha256: $sha256}'
            done |
              jq -s 'sort_by(.name)'
          )"
          jq -n \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg notesSha256 "$(
              sha256sum release-authority/release-notes.md | cut -d' ' -f1
            )" \
            --argjson assets "$assets" \
            '{
              schemaVersion: 1,
              gate: "orbitpm-lite-release-mutation-authority",
              candidateSha: $candidateSha,
              releaseTag: "v0.4.5",
              releaseTitle: "OrbitPM Process Studio Lite 0.4.5",
              notesSha256: $notesSha256,
              assets: $assets
            }' > release-authority/release-mutation-authority.json

      - name: Preserve immutable fixed-data mutation authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-release-mutation-authority-${{ inputs.candidate_sha }}
          path: release-authority/
          if-no-files-found: error
          retention-days: 90

  protected-tag:
    name: Protected isolated annotated-tag authority
    needs: verify-pretag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: release-v0.4.5
    steps:
      - name: Require policy and create or read back the protected tag
        env:
          APPROVAL_POLICY: ${{ vars.ORBITPM_RELEASE_APPROVAL_POLICY }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_ADMIN_TOKEN: ${{ secrets.ORBITPM_RELEASE_ADMIN_TOKEN }}
          RULESET_BYPASS_ACTOR_ID: ${{ vars.ORBITPM_RELEASE_TAG_BYPASS_ACTOR_ID }}
          RULESET_ID: ${{ vars.ORBITPM_RELEASE_TAG_RULESET_ID }}
        run: |
          test "$APPROVAL_POLICY" = \
            "v0.4.5-nvda-voiceover-arabic-48h-p0p1-reviewed"
          test -n "$GH_ADMIN_TOKEN"
          for numeric in "$RULESET_ID" "$RULESET_BYPASS_ACTOR_ID"; do
            case "$numeric" in
              '' | *[!0-9]*) exit 1 ;;
            esac
          done
          test "$RULESET_BYPASS_ACTOR_ID" = "5"
          immutable_json="$(
            GH_TOKEN="$GH_ADMIN_TOKEN" gh api \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/immutable-releases"
          )"
          test "$(jq -r .enabled <<<"$immutable_json")" = "true"
          ruleset_json="$(
            GH_TOKEN="$GH_ADMIN_TOKEN" gh api \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/rulesets/$RULESET_ID"
          )"
          jq -e \
            --argjson actor "$RULESET_BYPASS_ACTOR_ID" \
            --argjson id "$RULESET_ID" \
            '
              .id == $id and
              .name == "OrbitPM protected v* release tags" and
              .target == "tag" and
              .enforcement == "active" and
              .conditions.ref_name.include == ["refs/tags/v*"] and
              .conditions.ref_name.exclude == [] and
              ([.rules[].type] | sort) == ["creation", "deletion", "update"] and
              .bypass_actors == [{
                actor_id: $actor,
                actor_type: "RepositoryRole",
                bypass_mode: "always"
              }]
            ' <<<"$ruleset_json" >/dev/null
          main_ref_json="$(
            GH_TOKEN="$GH_ADMIN_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main"
          )"
          test "$(jq -r .object.sha <<<"$main_ref_json")" = "$CANDIDATE_SHA"
          if ! GH_TOKEN="$GH_ADMIN_TOKEN" gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.4.5" \
            > protected-tag-ref.json 2>/dev/null
          then
            tag_object="$(
              GH_TOKEN="$GH_ADMIN_TOKEN" gh api \
                "repos/$GITHUB_REPOSITORY/git/tags" \
                --method POST \
                --field tag=v0.4.5 \
                --field message='OrbitPM Process Studio Lite 0.4.5' \
                --field object="$CANDIDATE_SHA" \
                --field type=commit \
                --jq .sha
            )"
            GH_TOKEN="$GH_ADMIN_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              --method POST \
              --field ref=refs/tags/v0.4.5 \
              --field sha="$tag_object" \
              > protected-tag-ref.json
          fi
          tag_object_sha="$(jq -er .object.sha protected-tag-ref.json)"
          GH_TOKEN="$GH_ADMIN_TOKEN" gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
            > protected-tag-object.json
          test "$(jq -r .tag protected-tag-object.json)" = "v0.4.5"
          test "$(jq -r .message protected-tag-object.json)" = \
            "OrbitPM Process Studio Lite 0.4.5"
          test "$(jq -r .object.type protected-tag-object.json)" = "commit"
          test "$(jq -r .object.sha protected-tag-object.json)" = "$CANDIDATE_SHA"

  draft-release:
    name: Isolated resumable deterministic draft writer
    needs: [verify-pretag, protected-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download previously verified immutable release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: orbitpm-verified-release-candidate-${{ inputs.candidate_sha }}
          path: release

      - name: Download immutable fixed-data mutation authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: orbitpm-release-mutation-authority-${{ inputs.candidate_sha }}
          path: release-authority

      - name: Validate immutable authority and write only the bound tag draft
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          authority=release-authority/release-mutation-authority.json
          notes=release-authority/release-notes.md
          expected_names="$(
            printf '%s\n' \
              LICENSE \
              OrbitPM-Excel-Example-0.4.5.xlsx \
              OrbitPM-Excel-Template-0.4.5.xlsx \
              OrbitPM-Process-Studio-Lite-0.4.5.cyclonedx.json \
              OrbitPM-Process-Studio-Lite-0.4.5.html \
              SHA256SUMS.txt \
              THIRD_PARTY_NOTICES.md
          )"
          actual_names="$(find release -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual_names" = "$expected_names"
          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            '
              (keys | sort) == [
                "assets",
                "candidateSha",
                "gate",
                "notesSha256",
                "releaseTag",
                "releaseTitle",
                "schemaVersion"
              ] and
              .schemaVersion == 1 and
              .gate == "orbitpm-lite-release-mutation-authority" and
              .candidateSha == $candidate and
              .releaseTag == "v0.4.5" and
              .releaseTitle == "OrbitPM Process Studio Lite 0.4.5" and
              (.notesSha256 | test("^[a-f0-9]{64}$")) and
              (.assets | length) == 7 and
              ([.assets[].name] | sort) == [
                "LICENSE",
                "OrbitPM-Excel-Example-0.4.5.xlsx",
                "OrbitPM-Excel-Template-0.4.5.xlsx",
                "OrbitPM-Process-Studio-Lite-0.4.5.cyclonedx.json",
                "OrbitPM-Process-Studio-Lite-0.4.5.html",
                "SHA256SUMS.txt",
                "THIRD_PARTY_NOTICES.md"
              ] and
              all(
                .assets[];
                (keys | sort) == ["name", "sha256", "size"] and
                (.size | type) == "number" and
                .size > 0 and
                (.sha256 | test("^[a-f0-9]{64}$"))
              )
            ' "$authority" >/dev/null
          test "$(sha256sum "$notes" | cut -d' ' -f1)" = \
            "$(jq -r .notesSha256 "$authority")"
          while IFS=$'\t' read -r name size sha256; do
            test "$name" = "$(basename "$name")"
            test "$(stat --format=%s "release/$name")" = "$size"
            test "$(sha256sum "release/$name" | cut -d' ' -f1)" = "$sha256"
          done < <(jq -r '.assets[] | [.name, .size, .sha256] | @tsv' "$authority")
          main_ref_json="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main"
          )"
          test "$(jq -r .object.sha <<<"$main_ref_json")" = "$CANDIDATE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.4.5" \
            > protected-tag-ref.json
          tag_object_sha="$(jq -er .object.sha protected-tag-ref.json)"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
            > protected-tag-object.json
          test "$(jq -r .tag protected-tag-object.json)" = "v0.4.5"
          test "$(jq -r .message protected-tag-object.json)" = \
            "OrbitPM Process Studio Lite 0.4.5"
          test "$(jq -r .object.type protected-tag-object.json)" = "commit"
          test "$(jq -r .object.sha protected-tag-object.json)" = "$CANDIDATE_SHA"
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.4.5" \
            > draft-release.json 2>/dev/null
          then
            jq -n \
              --arg tag v0.4.5 \
              --arg target "$CANDIDATE_SHA" \
              --arg name "OrbitPM Process Studio Lite 0.4.5" \
              --rawfile body "$notes" \
              '{
                tag_name: $tag,
                target_commitish: $target,
                name: $name,
                body: $body,
                draft: true,
                prerelease: false,
                make_latest: "false"
              }' |
              gh api "repos/$GITHUB_REPOSITORY/releases" \
                --method POST \
                --input - \
                > draft-release.json
          fi
          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            --rawfile notes "$notes" \
            '
              .tag_name == "v0.4.5" and
              .target_commitish == $candidate and
              .name == "OrbitPM Process Studio Lite 0.4.5" and
              .body == $notes and
              .draft == true and
              .prerelease == false and
              .published_at == null and
              .immutable != true
            ' draft-release.json >/dev/null
          release_id="$(jq -er .id draft-release.json)"
          jq -c '.assets[] | select(.state == "starter")' draft-release.json |
            while IFS= read -r starter; do
              asset_id="$(jq -er .id <<<"$starter")"
              asset_name="$(jq -er .name <<<"$starter")"
              test "$asset_name" = "$(basename "$asset_name")"
              test -f "release/$asset_name"
              test "$(jq -er .size <<<"$starter")" -eq 0
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                > starter-before-delete.json
              test "$(jq -r .name starter-before-delete.json)" = "$asset_name"
              test "$(jq -r .state starter-before-delete.json)" = "starter"
              test "$(jq -r .size starter-before-delete.json)" -eq 0
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                > draft-before-starter-delete.json
              test "$(jq -r .tag_name draft-before-starter-delete.json)" = "v0.4.5"
              test "$(jq -r .draft draft-before-starter-delete.json)" = "true"
              test "$(jq -r .id draft-before-starter-delete.json)" = "$release_id"
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                --method DELETE
            done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.4.5" \
            > draft-release.json
          for name in \
            LICENSE \
            OrbitPM-Excel-Example-0.4.5.xlsx \
            OrbitPM-Excel-Template-0.4.5.xlsx \
            OrbitPM-Process-Studio-Lite-0.4.5.cyclonedx.json \
            OrbitPM-Process-Studio-Lite-0.4.5.html \
            SHA256SUMS.txt \
            THIRD_PARTY_NOTICES.md
          do
            if ! jq -e --arg name "$name" \
              '.assets[] | select(.name == $name)' \
              draft-release.json >/dev/null
            then
              gh release upload v0.4.5 "release/$name"
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.4.5" > draft-release.json
          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            --rawfile notes "$notes" \
            '
              .tag_name == "v0.4.5" and
              .target_commitish == $candidate and
              .name == "OrbitPM Process Studio Lite 0.4.5" and
              .body == $notes and
              .draft == true and
              .prerelease == false and
              .published_at == null and
              .immutable != true and
              (.assets | length) == 7 and
              ([.assets[].name] | sort) == [
                "LICENSE",
                "OrbitPM-Excel-Example-0.4.5.xlsx",
                "OrbitPM-Excel-Template-0.4.5.xlsx",
                "OrbitPM-Process-Studio-Lite-0.4.5.cyclonedx.json",
                "OrbitPM-Process-Studio-Lite-0.4.5.html",
                "SHA256SUMS.txt",
                "THIRD_PARTY_NOTICES.md"
              ]
            ' draft-release.json >/dev/null
          while IFS=$'\t' read -r name size sha256; do
            test "$(
              jq --arg name "$name" \
                '[.assets[] | select(
                  .name == $name and
                  .state == "uploaded"
                )] | length' \
                draft-release.json
            )" -eq 1
            test "$(
              jq -r --arg name "$name" \
                '.assets[] | select(.name == $name) | .size' \
                draft-release.json
            )" = "$size"
            test "$(
              jq -r --arg name "$name" \
                '.assets[] | select(.name == $name) | .digest' \
                draft-release.json
            )" = "sha256:$sha256"
          done < <(jq -r '.assets[] | [.name, .size, .sha256] | @tsv' "$authority")
          mkdir draft-download
          gh release download v0.4.5 --dir draft-download
          test "$(find draft-download -maxdepth 1 -type f | wc -l)" -eq 7
          while IFS=$'\t' read -r name _size sha256; do
            test "$(sha256sum "draft-download/$name" | cut -d' ' -f1)" = "$sha256"
          done < <(jq -r '.assets[] | [.name, .size, .sha256] | @tsv' "$authority")

  tag-quality:
    name: Full clean quality rebuild from the actual annotated tag
    needs: draft-release
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml
    with:
      source_ref: refs/tags/v0.4.5
      expected_sha: ${{ inputs.candidate_sha }}
      artifact_prefix: orbitpm-tag-tested-pages
      release_tag: v0.4.5
      release_mode: true

  verify-tag-release:
    name: Bind draft assets to the clean tag-quality rebuild
    needs: [verify-pretag, tag-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the actual annotated release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/v0.4.5
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate tag and origin/main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/tags/v0.4.5:refs/tags/v0.4.5
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/check-release-tag.mjs v0.4.5 --require-origin-main

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm
        run: npm install --global npm@11.13.0

      - name: Reproducible install
        run: npm ci

      - name: Download the tag-quality HTML
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: orbitpm-tag-tested-pages-${{ inputs.candidate_sha }}
          path: tag-dist

      - name: Download the independently verified pre-tag asset set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: orbitpm-verified-release-candidate-${{ inputs.candidate_sha }}
          path: verified-candidate

      - name: Download the initial trusted external-evidence aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: orbitpm-verified-external-evidence-${{ inputs.candidate_sha }}
          path: initial-evidence

      - name: Assemble and compare all seven clean tag bytes
        run: |
          npm run release:assemble -- --html tag-dist/index.html --out tag-release
          npm run release:verify -- tag-release
          npm run release:verify -- verified-candidate
          for candidate in tag-release/*; do
            name="$(basename "$candidate")"
            cmp "$candidate" "verified-candidate/$name"
          done

      - name: Re-download the draft and bind metadata and bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.4.5" > draft-release.json
          mkdir draft-download
          gh release download v0.4.5 --dir draft-download
          npm run release:verify -- draft-download
          node scripts/release-state.mjs \
            --release-json=draft-release.json \
            --assets=draft-download \
            --expected-assets=tag-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag=v0.4.5 \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=draft

      - name: Reverify external evidence against clean tag bytes
        env:
          EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
        run: >-
          node scripts/verify-external-release-evidence.mjs
          --candidate-sha=${{ inputs.candidate_sha }}
          --candidate-ready-at=${{ needs.verify-pretag.outputs.candidate_ready_at }}
          --artifact=tag-release/OrbitPM-Process-Studio-Lite-0.4.5.html
          --url="$EVIDENCE_URL"
          --sha256="$EVIDENCE_SHA256"
          --output=release-evidence/tag-external-evidence-verification.json

      - name: Compare tag verification with the retained pre-tag aggregate
        env:
          EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
          EVIDENCE_URL: ${{ inputs.external_evidence_url }}
        run: |
          node scripts/release-evidence-chain.mjs verify \
            --aggregate=release-evidence/tag-external-evidence-verification.json \
            --candidate-sha=${{ inputs.candidate_sha }} \
            --candidate-ready-at=${{ needs.verify-pretag.outputs.candidate_ready_at }} \
            --artifact=tag-release/OrbitPM-Process-Studio-Lite-0.4.5.html \
            --source-url="$EVIDENCE_URL" \
            --source-sha256="$EVIDENCE_SHA256"
          node scripts/release-evidence-chain.mjs compare \
            --trusted=initial-evidence/external-evidence-verification.json \
            --observed=release-evidence/tag-external-evidence-verification.json

      - name: Final immutable identity read-back
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/tags/v0.4.5:refs/tags/v0.4.5
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          node scripts/check-release-tag.mjs v0.4.5 --require-origin-main
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.4.5" > final-draft-release.json
          node scripts/release-state.mjs \
            --release-json=final-draft-release.json \
            --assets=draft-download \
            --expected-assets=tag-release \
            --notes=docs/RELEASE_NOTES_0.4.5.md \
            --tag=v0.4.5 \
            --title="OrbitPM Process Studio Lite 0.4.5" \
            --state=draft

      - name: Preserve exact tag-built release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-tag-release-assets-${{ inputs.candidate_sha }}
          path: tag-release/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve tag-bound external evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbitpm-tag-external-evidence-${{ inputs.candidate_sha }}
          path: release-evidence/tag-external-evidence-verification.json
          if-no-files-found: error
          retention-days: 90
